<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earn Coins App</title>

    <!-- TADS Script -->
    <script src="https://w.tads.me/widget.js"></script>

    <!-- Telegram WebApp -->
    <script src="https://telegram.org/js/telegram-web-app.js?62"></script>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: #0f172a;
            color: white;
            padding: 20px;
        }
        button {
            padding: 12px 25px;
            font-size: 16px;
            border: none;
            border-radius: 10px;
            background: #22c55e;
            color: white;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h2>💰 Earn Coins</h2>

    <p>Balance: <span id="balance">0</span> coins</p>
    <p>Today Ads Watched: <span id="adCount">0</span>/20</p>

    <button id="showAdBtn">▶ Watch Ad</button>

    <!-- Ad Container -->
    <div id="tads-container-9689"></div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {

            const WIDGET_ID = "9689";
            const IS_DEBUG = false;

            const DAILY_LIMIT = 20;
            const REWARD = 50;

            const today = new Date().toLocaleDateString();

            let balance = parseInt(localStorage.getItem("balance")) || 0;
            let adData = JSON.parse(localStorage.getItem("adData")) || { date: today, count: 0 };

            if (adData.date !== today) {
                adData = { date: today, count: 0 };
            }

            updateUI();

            function updateUI() {
                document.getElementById("balance").innerText = balance;
                document.getElementById("adCount").innerText = adData.count;
            }

            const onShowRewardCallback = () => {

                if (adData.count >= DAILY_LIMIT) {
                    alert("❌ Daily limit reached");
                    return;
                }

                balance += REWARD;
                adData.count++;

                localStorage.setItem("balance", balance);
                localStorage.setItem("adData", JSON.stringify(adData));

                updateUI();

                alert("✅ +" + REWARD + " coins added");
            };

            const onAdsNotFound = () => {
                alert("❌ No ads available now");
            };

            const adController = window.tads.init({
                widgetId: WIDGET_ID,
                type: 'fullscreen',
                debug: IS_DEBUG,
                onShowReward: onShowRewardCallback,
                onAdsNotFound: onAdsNotFound,
            });

            let lastClick = 0;

            document.getElementById("showAdBtn").addEventListener('click', () => {

                const now = Date.now();

                if (now - lastClick < 3000) {
                    alert("⏳ Wait 3 seconds");
                    return;
                }

                lastClick = now;

                if (adData.count >= DAILY_LIMIT) {
                    alert("❌ Daily limit finished");
                    return;
                }

                adController
                    .then((controller) => controller.showAd())
                    .catch((err) => console.log(err));
            });

        });
    </script>

</body>
</html>
