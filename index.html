<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{
    --bg:#080b14;
    --card:rgba(255,255,255,.045);

    --txt:#eef2ff;

  html,body{margin:0;padding:0;height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
    background:var(--bg); color:var(--txt);
    min-height:100vh; overflow-x:hidden; position:relative;

  body::before{
    content:''; position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(60% 40% at 12% 0%, rgba(124,92,255,.32), transparent 70%),
      radial-gradient(50% 38% at 92% 8%, rgba(34,211,238,.18), transparent 70%),
      radial-gradient(70% 45% at 50% 112%, rgba(124,92,255,.20), transparent 70%);
  }
  .app{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:0 16px 40px}

  .topbar{display:flex;align-items:center;gap:13px;padding:22px 2px 16px}
  .logo{
    width:50px;height:50px;flex:0 0 50px;border-radius:16px;
    display:grid;place-items:center;font-size:25px;
    background:linear-gradient(135deg,var(--accent1),var(--accent2));
    box-shadow:0 10px 26px rgba(124,92,255,.48);

  @keyframes logoPulse{

    50%{box-shadow:0 10px 34px rgba(34,211,238,.55)}
  }
  .topbar h1{margin:0;font-size:19px;font-weight:800;letter-spacing:.2px}
  .topbar p{margin:4px 0 0;font-size:12px;color:var(--muted);font-weight:500}

  .progress-card{
    position:relative;overflow:hidden;
    background:linear-gradient(160deg,rgba(124,92,255,.20),rgba(34,211,238,.07));
    border:1px solid rgba(255,255,255,.11);border-radius:20px;
    padding:16px 16px 15px;margin-bottom:20px;
    box-shadow:0 14px 34px rgba(0,0,0,.40);
    animation:rise .6s cubic-bezier(.2,.8,.2,1) both;
  }
  .progress-card::after{
    content:'';position:absolute;top:0;left:-60%;width:55%;height:100%;
    background:linear-gradient(100deg,transparent,rgba(255,255,255,.10),transparent);
    animation:sheen 4.5s ease-in-out infinite;pointer-events:none;
  }
  @keyframes sheen{0%{left:-60%}55%{left:130%}100%{left:130%}}
  .p-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:11px}
  .p-row .lbl{font-size:13px;font-weight:700;letter-spacing:.3px}
  .p-row .val{
    font-size:13px;font-weight:800;
    background:linear-gradient(135deg,#a78bfa,#67e8f9);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .track{height:9px;border-radius:99px;background:rgba(255,255,255,.09);overflow:hidden}
  .fill{
    height:100%;width:0;border-radius:99px;
    background:linear-gradient(90deg,var(--accent1),var(--accent2));
    box-shadow:0 0 16px rgba(124,92,255,.75);
    transition:width .65s cubic-bezier(.2,.8,.2,1);
  }
  .p-sub{margin-top:9px;font-size:11.5px;color:var(--muted);font-weight:500}

  .mission{
    position:relative;background:var(--card);
    border:1px solid var(--stroke);border-radius:20px;
    padding:14px;margin-bottom:14px;
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    animation:rise .55s cubic-bezier(.2,.8,.2,1) both;
    transition:border-color .35s, box-shadow .35s, background .35s;
  }
  @keyframes rise{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
  .mission.completed{
    border-color:rgba(34,197,94,.48);
    background:linear-gradient(160deg,rgba(34,197,94,.10),rgba(255,255,255,.03));
    box-shadow:0 10px 28px rgba(34,197,94,.16);
  }

  .m-top{display:flex;align-items:flex-start;gap:12px}
  .m-icon{
    width:46px;height:46px;flex:0 0 46px;border-radius:15px;
    display:grid;place-items:center;font-size:22px;
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.07);

  .mission.completed .m-icon{transform:scale(1.05)}
  .m-text{flex:1;min-width:0}
  .m-text h3{margin:2px 0 0;font-size:14.5px;font-weight:700;line-height:1.32;letter-spacing:.1px}
  .m-text p{margin:5px 0 0;font-size:11.5px;color:var(--muted);line-height:1.4;font-weight:500}
  .m-badge{

    background:rgba(255,255,255,.07);

  .m-badge b{color:#c4b5fd}
  .m-badge span{font-size:11px;color:var(--muted);font-weight:700}
  .mission.completed .m-badge{background:rgba(34,197,94,.15);border-color:rgba(34,197,94,.35)}
  .mission.completed .m-badge b{color:#5ee89b}

  .m-track{height:6px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:13px}
  .m-fill{
    height:100%;width:0;border-radius:99px;
    background:linear-gradient(90deg,var(--accent1),var(--accent2));
    transition:width .5s cubic-bezier(.2,.8,.2,1);
  }
  .mission.completed .m-fill{background:linear-gradient(90deg,#22c55e,#4ade80);box-shadow:0 0 12px rgba(34,197,94,.6)}

  .m-btn{
    position:relative;overflow:hidden;
    display:flex;align-items:center;justify-content:center;
    width:100%;height:48px;margin-top:13px;
    border:1px solid transparent;border-radius:14px;
    font-family:inherit;font-size:14px;font-weight:700;letter-spacing:.2px;
    color:#fff;cursor:pointer;user-select:none;
    background:linear-gradient(135deg,var(--accent1),var(--accent2));
    box-shadow:0 9px 22px rgba(124,92,255,.32);
    transition:transform .15s ease, box-shadow .3s, background .3s, color .3s, border-color .3s;
  }
  .m-btn > span:not(.cd-fill){position:relative;z-index:1}
  .m-btn:active{transform:scale(.972)}
  .m-btn:disabled{cursor:default}
  .m-btn.loading{filter:saturate(.55) brightness(.92)}
  .m-btn.counting{
    background:rgba(255,255,255,.06);color:#cfd6ff;box-shadow:none;
    border-color:rgba(255,255,255,.15);
  }
  .m-btn.done{
    background:rgba(34,197,94,.14);color:#5ee89b;box-shadow:none;
    border-color:rgba(34,197,94,.36);
  }
  .cd-fill{
    position:absolute;left:0;top:0;bottom:0;width:0;z-index:0;
    background:linear-gradient(90deg,rgba(124,92,255,.55),rgba(34,211,238,.55));
    pointer-events:none;
  }
  .spinner{
    display:none;width:15px;height:15px;margin-right:9px;border-radius:50%;
    border:2px solid rgba(255,255,255,.35);border-top-color:#fff;
    animation:spin .7s linear infinite;
  }
  .m-btn.loading .spinner{display:inline-block}
  @keyframes spin{to{transform:rotate(360deg)}}

  .toast{
    position:fixed;left:50%;bottom:28px;z-index:70;
    transform:translate(-50%,22px);opacity:0;
    padding:12px 20px;border-radius:15px;
    background:rgba(18,22,36,.94);
    border:1px solid rgba(255,255,255,.11);
    box-shadow:0 14px 36px rgba(0,0,0,.55);
    font-size:13px;font-weight:700;color:#fff;
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    transition:opacity .35s, transform .35s cubic-bezier(.2,.8,.2,1);
    pointer-events:none;max-width:90vw;text-align:center;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}

  .congrats{
    position:fixed;inset:0;z-index:65;
    display:none;place-items:center;padding:26px;
    background:rgba(5,7,14,.74);
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  }
  .congrats.show{display:grid;animation:fadeIn .35s ease both}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .cg-card{
    position:relative;width:100%;max-width:370px;text-align:center;
    padding:34px 24px 26px;border-radius:28px;
    background:linear-gradient(165deg,rgba(124,92,255,.30),rgba(34,211,238,.10));
    border:1px solid rgba(255,255,255,.17);
    box-shadow:0 34px 80px rgba(0,0,0,.65);
    animation:pop .75s cubic-bezier(.2,1.35,.4,1) both;
  }
  @keyframes pop{
    0%{opacity:0;transform:scale(.55) translateY(36px)}
    60%{transform:scale(1.045)}
    100%{opacity:1;transform:scale(1)}
  }
  .cg-trophy{
    position:relative;width:104px;height:104px;margin:0 auto 18px;
    display:grid;place-items:center;font-size:52px;border-radius:50%;
    background:radial-gradient(circle at 50% 40%,rgba(255,255,255,.20),rgba(124,92,255,.28));
    border:1px solid rgba(255,255,255,.20);
    animation:trophyFloat 2.6s ease-in-out infinite;

    0%,100%{transform:translateY(0) scale(1)}

  .cg-trophy::before,.cg-trophy::after{
    content:'';position:absolute;inset:-10px;border-radius:50%;

  .cg-card h2{
    margin:0 0 10px;font-size:25px;font-weight:900;letter-spacing:.3px;
    background:linear-gradient(135deg,#ffffff,#c4b5fd 55%,#67e8f9);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .cg-card p{margin:0 0 20px;font-size:13.5px;line-height:1.6;color:#b9c0d8;font-weight:500}
  .cg-stats{display:flex;gap:10px;margin-bottom:14px}
  .cg-stat{
    flex:1;padding:12px 6px;border-radius:16px;
    background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.10);
  }
  .cg-stat b{display:block;font-size:19px;font-weight:900;color:#fff}
  .cg-stat span{display:block;margin-top:3px;font-size:10.5px;color:var(--muted);font-weight:700;letter-spacing:.4px;text-transform:uppercase}

  .cg-when{display:flex;gap:10px;margin-bottom:22px}
  .cg-when-item{
    flex:1;padding:11px 12px;border-radius:16px;
    background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.10);
    text-align:left;
  }
  .cg-when-item .k{
    display:block;font-size:10px;font-weight:800;letter-spacing:.6px;
    text-transform:uppercase;color:var(--muted);margin-bottom:5px;
  }
  .cg-when-item .v{
    display:block;font-size:14px;font-weight:900;color:#fff;letter-spacing:.2px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }

  .cg-btn{
    width:100%;height:52px;border:none;border-radius:16px;
    font-family:inherit;font-size:15px;font-weight:800;letter-spacing:.3px;color:#fff;
    background:linear-gradient(135deg,var(--accent1),var(--accent2));
    box-shadow:0 12px 28px rgba(124,92,255,.45);
    cursor:pointer;transition:transform .15s;
  }
  .cg-btn:active{transform:scale(.97)}
  .cg-spark{position:absolute;font-size:18px;opacity:.9;animation:spark 2.2s ease-in-out infinite}
  @keyframes spark{0%,100%{transform:translateY(0) scale(1);opacity:.5}50%{transform:translateY(-9px) scale(1.2);opacity:1}}

  #confetti{position:fixed;inset:0;z-index:80;overflow:hidden;pointer-events:none}
  .confetti-piece{
    position:absolute;top:-24px;display:block;border-radius:2px;
    opacity:0;animation:fall linear forwards;
  }
  @keyframes fall{
    0%{opacity:1;transform:translateY(-24px) rotate(0deg)}
    100%{opacity:0;transform:translateY(110vh) rotate(760deg)}
  }

  .footer{text-align:center;margin-top:26px;font-size:11px;color:rgba(139,147,171,.6);font-weight:600;letter-spacing:.5px}
</style>

<body>

<div class="app">
  <header class="topbar">
    <div class="logo">🎯</div>

      <h1>Complete 6 Missions</h1>
      <p>Finish every mission to unlock your reward</p>

  </header>

  <section class="progress-card">
    <div class="p-row">
      <span class="lbl">Overall Progress</span>
      <span class="val" id="overallText">0 / 36</span>
    </div>
    <div class="track"><div class="fill" id="overallFill"></div></div>
    <div class="p-sub" id="overallSub">0 of 6 missions completed</div>
  </section>

  <main id="missions"></main>
  <div class="footer">POWERED BY TELEGRAM MINI APP</div>

    <span class="cg-spark" style="top:16px;left:24px;animation-delay:.2s">✨</span>
    <span class="cg-spark" style="top:34px;right:26px;animation-delay:.8s">🎉</span>
    <span class="cg-spark" style="bottom:96px;left:18px;animation-delay:1.3s">⭐</span>

<script>
/* =========================================================
   1) Telegram Mini App init
   ========================================================= */
const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
if (tg) {
  try {
    tg.ready(); tg.expand();
    if (tg.setHeaderColor) tg.setHeaderColor('#080b14');
    if (tg.setBackgroundColor) tg.setBackgroundColor('#080b14');
    if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();
  } catch (e) {}
}

/* =========================================================
   2) Ad config
   ========================================================= */
const ADSGRAM_BLOCK_ID = '30645';
const ADSBITVEX_APP_ID = '000274';
const MONETAG_ZONE     = '10541383';

/* =========================================================
   3) Mission list
   ========================================================= */
const MISSIONS = [
  { id:1, kind:'ad', provider:'adsgram',
    icon:'📺', title:'Watch Adsgram Ads',
    desc:'Watch a full Adsgram ad to earn 1 point',
    button:'Watch Adsgram Ads', limit:6 },

  { id:2, kind:'link', icon:'🔗',
    title:'Click The Link & Stay 5 Seconds',
    desc:'Open the link and stay there for 5 seconds',
    button:'Click The Link', limit:6,
    url:'https://bowlsharp.com/yg0bftcw?key=568ce0b3290df6de10b74a13af0c817c' },

  { id:3, kind:'ad', provider:'adsbitvex',
    icon:'🎬', title:'Watch Adsbitbex Ads',
    desc:'Watch a full Adsbitbex ad to earn 1 point',
    button:'Watch Adsbitbex Ads', limit:6 },

  { id:4, kind:'link', icon:'🌐',
    title:'Click The Link & Stay 5 Seconds',
    desc:'Open the link and stay there for 5 seconds',
    button:'Click The Link', limit:6,
    url:'https://wwp.giriubin.com/redirect-zone/31c41a18' },

  { id:5, kind:'ad', provider:'monetag',
    icon:'💎', title:'Watch Monetag Ads',
    desc:'Watch a full Monetag ad to earn 1 point',
    button:'Watch Monetag Ads', limit:6 },

  { id:6, kind:'link', icon:'🚀',
    title:'Click The Link & Stay 5 Seconds',
    desc:'Open the link and stay there for 5 seconds',
    button:'Click The Link', limit:6,
    url:'https://wwp.giriubin.com/redirect-zone/31c41a18' }
];

const LINK_STAY_SECONDS = 5;

/* =========================================================
   4) State
   ========================================================= */
const state = MISSIONS.map(() => ({ count:0, busy:false }));
const refs = [];
let congratsShown = false;
let congratsAt = null;

/* =========================================================
   5) Helpers
   ========================================================= */
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

function haptic(type) {
  if (!tg || !tg.HapticFeedback) return;
  try {
    if (type === 'light')   tg.HapticFeedback.impactOccurred('light');
    else if (type === 'medium') tg.HapticFeedback.impactOccurred('medium');
    else if (type === 'heavy')  tg.HapticFeedback.impactOccurred('heavy');
    else if (type === 'success') tg.HapticFeedback.notificationOccurred('success');
    else if (type === 'error')   tg.HapticFeedback.notificationOccurred('error');
  } catch (e) {}
}

function openLink(url) {
  if (!url) return;
  try {
    if (tg && tg.openLink) tg.openLink(url, { try_instant_view:false });
    else window.open(url, '_blank');
  } catch (e) {
    try { window.open(url, '_blank'); } catch (e2) {}
  }
}

async function waitFor(checkFn, tries = 20, delay = 200) {
  for (let i = 0; i < tries; i++) {
    try { if (checkFn()) return true; } catch (e) {}
    await sleep(delay);
  }
  return false;
}

let toastTimer = null;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2000);
}

/* =========================================================
   6) Adsgram init
   ========================================================= */
let adsgramController = null;

function initAdsgram() {
  if (adsgramController) return adsgramController;
  if (window.Adsgram && typeof window.Adsgram.init === 'function') {
    try {
      adsgramController = window.Adsgram.init({ blockId: ADSGRAM_BLOCK_ID });
    } catch (e) { adsgramController = null; }
  }
  return adsgramController;
}
initAdsgram();
window.addEventListener('load', () => initAdsgram());
setTimeout(() => initAdsgram(), 1500);

/* =========================================================
   7) 🔒 STRICT AD RUNNER
   ---------------------------------------------------------
   Point counts ONLY when one of these is TRUE:

   ▶ For Adsbitvex & Monetag:
       • page was hidden (ad tab opened) for >= MIN_HIDDEN_MS
       • user came back to the page
       (Promise resolve alone NEVER counts.)

   ▶ For Adsgram:
       • onReward event fires (SDK confirms ad watched), OR
       • promise resolves with { done: true }
       AND at least MIN_TIME_MS has passed since click.
   ========================================================= */
const MIN_HIDDEN_MS   = 5000;    // page must be hidden >= 5s (real ad watch)
const MIN_TIME_MS     = 5000;    // absolute min before any point (anti-instant)
const FAIL_OPEN_MS    = 12000;   // ad didn't open in 12s → fail (fallback)
const HARD_CAP_MS     = 150000;  // absolute cap 2.5min

function runAd(provider, onProgress) {
  return new Promise((resolve) => {
    const startTime = Date.now();
    let settled = false;
    let hiddenStart = 0;
    let totalHidden = 0;
    let everHidden = false;
    let rewardSignal = false;

    const cleanup = () => {
      document.removeEventListener('visibilitychange', onVis);
      window.removeEventListener('blur', onBlur);
      window.removeEventListener('focus', onFocus);
      window.removeEventListener('pagehide', onPageHide);
      window.removeEventListener('pageshow', onPageShow);
      clearInterval(poller);
      clearTimeout(failTimer);
      clearTimeout(capTimer);
    };

    const finish = (v) => {
      if (settled) return;
      settled = true;
      cleanup();
      resolve(v);
    };

    const updateHidden = () => {
      if (document.hidden || document.visibilityState === 'hidden') {
        if (!hiddenStart) hiddenStart = Date.now();
        everHidden = true;
      } else {
        if (hiddenStart) {
          totalHidden += Date.now() - hiddenStart;
          hiddenStart = 0;
        }
      }
    };

    const elapsed = () => Date.now() - startTime;

    /* ---------- STRICT visibility rule ---------- */
    const canFinishFromHidden = () => {
      return everHidden
          && totalHidden >= MIN_HIDDEN_MS
          && elapsed() >= MIN_TIME_MS
          && !document.hidden;
    };

    const checkState = () => {
      updateHidden();

      // progress feedback
      if (onProgress) {
        if (document.hidden && hiddenStart) {
          onProgress('watching', Math.floor((Date.now() - hiddenStart) / 1000));
        } else if (everHidden && totalHidden > 0 && totalHidden < MIN_HIDDEN_MS) {
          onProgress('watch-more', Math.ceil((MIN_HIDDEN_MS - totalHidden) / 1000));
        }
      }

      if (canFinishFromHidden()) {
        finish(true);
      }
    };

    const onVis     = () => checkState();
    const onBlur    = () => { if (!hiddenStart) hiddenStart = Date.now(); everHidden = true; checkState(); };
    const onFocus   = () => checkState();
    const onPageHide= () => { if (!hiddenStart) hiddenStart = Date.now(); everHidden = true; };
    const onPageShow= () => checkState();

    document.addEventListener('visibilitychange', onVis);
    window.addEventListener('blur', onBlur);
    window.addEventListener('focus', onFocus);
    window.addEventListener('pagehide', onPageHide);
    window.addEventListener('pageshow', onPageShow);

    const poller = setInterval(checkState, 250);

    /* ---------- Fail timer: ad never opened ---------- */
    const failTimer = setTimeout(() => {
      if (!everHidden && !rewardSignal && !document.hidden) {
        finish(false);
      }
    }, FAIL_OPEN_MS);

    /* ---------- Hard cap ---------- */
    const capTimer = setTimeout(() => {
      finish(rewardSignal || canFinishFromHidden());
    }, HARD_CAP_MS);

    /* =====================================================
       Trigger the SDK
       ===================================================== */
    try {
      /* ---------- ADSGRAM (trust onReward + done:true) ---------- */
      if (provider === 'adsgram') {
        const ctrl = initAdsgram();
        if (!ctrl || typeof ctrl.show !== 'function') { finish(false); return; }

        try {
          if (typeof ctrl.on === 'function') {
            ctrl.on('onReward', () => {
              rewardSignal = true;
              const wait = Math.max(0, MIN_TIME_MS - elapsed());
              setTimeout(() => finish(true), wait);
            });
            ctrl.on('onError', () => {
              /* don't finish — visibility rule may still apply */
            });
          }
        } catch (e) {}

        let p = null;
        try { p = ctrl.show(); } catch (e) { finish(false); return; }

        if (p && typeof p.then === 'function') {
          p.then((result) => {
            if (result && result.done === true) {
              rewardSignal = true;
              const wait = Math.max(0, MIN_TIME_MS - elapsed());
              setTimeout(() => finish(true), wait);
            }
            // result.done === false → don't finish, wait for visibility or cap
          }).catch(() => { /* ignore — visibility rule can still grant */ });
        }

      /* ---------- ADSBITVEX (strict visibility required) ---------- */
      } else if (provider === 'adsbitvex') {
        if (typeof window.showadsbitvex !== 'function') { finish(false); return; }

        let p = null;
        try { p = window.showadsbitvex(); } catch (e) { finish(false); return; }

        if (p && typeof p.then === 'function') {
          p.then(() => {
            /* ⚠️ promise resolve alone does NOT grant the point.
               We only grant if the page was actually hidden long enough. */
            if (canFinishFromHidden()) {
              finish(true);
            }
            // else: wait for visibility rule or fail/cap timer
          }).catch(() => {
            // If the ad errored and user never went away → fail soon
            if (!everHidden && elapsed() < FAIL_OPEN_MS) {
              setTimeout(() => {
                if (!everHidden && !canFinishFromHidden()) finish(false);
              }, FAIL_OPEN_MS - elapsed());
            }
          });
        }

      /* ---------- MONETAG (strict visibility required) ---------- */
      } else if (provider === 'monetag') {
        if (typeof window.show_10541383 !== 'function') { finish(false); return; }

        let p = null;
        try { p = window.show_10541383(); } catch (e) { finish(false); return; }

        if (p && typeof p.then === 'function') {
          p.then(() => {
            /* ⚠️ promise resolve alone does NOT grant the point. */
            if (canFinishFromHidden()) {
              finish(true);
            }
          }).catch(() => {
            if (!everHidden && elapsed() < FAIL_OPEN_MS) {
              setTimeout(() => {
                if (!everHidden && !canFinishFromHidden()) finish(false);
              }, FAIL_OPEN_MS - elapsed());
            }
          });
        }
      } else {
        finish(false);
      }
    } catch (e) {
      finish(false);
    }
  });
}

/* =========================================================
   8) Build mission cards
   ========================================================= */
function buildMissions() {
  const wrap = document.getElementById('missions');

  MISSIONS.forEach((m, i) => {
    const card = document.createElement('article');
    card.className = 'mission';
    card.style.animationDelay = (i * 80) + 'ms';

    card.innerHTML = `
      <div class="m-top">
        <div class="m-icon">${m.icon}</div>
        <div class="m-text">
          <h3>${m.title}</h3>
          <p>${m.desc}</p>
        </div>
        <div class="m-badge"><b>0</b><span>/${m.limit}</span></div>
      </div>
      <div class="m-track"><div class="m-fill"></div></div>
      <button class="m-btn" type="button">
        <span class="cd-fill"></span>
        <span class="spinner"></span>
        <span class="btn-label">${m.button}</span>
      </button>
    `;

    const ref = {
      card,
      num:  card.querySelector('.m-badge b'),
      fill: card.querySelector('.m-fill'),
      btn:  card.querySelector('.m-btn'),
      label:card.querySelector('.btn-label'),
      cd:   card.querySelector('.cd-fill')
    };

    ref.btn.addEventListener('click', () => onMissionClick(i));
    refs.push(ref);
    wrap.appendChild(card);
  });
}

/* =========================================================
   9) Click router
   ========================================================= */
function onMissionClick(i) {
  const m = MISSIONS[i];
  const s = state[i];
  if (s.busy || s.count >= m.limit) return;

  if (m.kind === 'ad') runAdMission(i);
  else runLinkMission(i);
}

/* ---------- Ad mission ---------- */
async function runAdMission(i) {
  const m = MISSIONS[i];
  const s = state[i];
  const r = refs[i];

  s.busy = true;
  haptic('light');
  r.btn.classList.add('loading');
  r.btn.disabled = true;

  const baseLabel = {
    adsgram:   'Watch Adsgram Ads',
    adsbitvex: 'Watch Adsbitbex Ads',
    monetag:   'Watch Monetag Ads'
  }[m.provider] || 'Watch Ad';

  // Progress callback — updates the button text while the ad is opening/watching
  const onProgress = (phase, sec) => {
    if (phase === 'watching') {
      r.label.textContent = 'Watching… ' + sec + 's';
    } else if (phase === 'watch-more') {
      r.label.textContent = 'Watch ' + sec + 's more…';
    }
  };

  let rewarded = false;

  if (m.provider === 'adsgram') {
    r.label.textContent = 'Opening Adsgram ad…';
    rewarded = await runAd('adsgram', onProgress);

    if (!rewarded) {
      r.label.textContent = 'Trying Monetag…';
      toast('Adsgram failed — switching to Monetag');
      await sleep(400);
      rewarded = await runAd('monetag', onProgress);
    }

  } else if (m.provider === 'adsbitvex') {
    r.label.textContent = 'Opening Adsbitbex ad…';
    const ready = await waitFor(() => typeof window.showadsbitvex === 'function', 20, 200);
    if (ready) rewarded = await runAd('adsbitvex', onProgress);
    else r.label.textContent = 'Adsbitbex not available';

  } else if (m.provider === 'monetag') {
    r.label.textContent = 'Opening Monetag ad…';
    const ready = await waitFor(() => typeof window.show_10541383 === 'function', 20, 200);
    if (ready) rewarded = await runAd('monetag', onProgress);
    else r.label.textContent = 'Monetag not available';
  }

  r.btn.classList.remove('loading');
  r.btn.disabled = false;
  r.label.textContent = baseLabel;
  s.busy = false;

  if (rewarded) {
    completeMission(i);
  } else {
    haptic('error');
    toast('Ad not completed — please try again');
  }
}

/* ---------- Link mission (single-shot, exactly 1 point) ---------- */
function runLinkMission(i) {
  const m = MISSIONS[i];
  const s = state[i];
  const r = refs[i];

  s.busy = true;
  haptic('light');

  if (m.url) openLink(m.url);

  r.btn.classList.add('counting');
  r.btn.disabled = true;

  r.cd.style.transition = 'none';
  r.cd.style.width = '0%';
  void r.cd.offsetWidth;
  r.cd.style.transition = 'width ' + LINK_STAY_SECONDS + 's linear';
  r.cd.style.width = '100%';

  const startTime = Date.now();
  r.label.textContent = 'Stay ' + LINK_STAY_SECONDS + 's…';

  let finished = false;
  let timer = null;

  const finish = () => {
    if (finished) return;
    finished = true;
    if (timer) clearInterval(timer);
    document.removeEventListener('visibilitychange', onVisible);

    r.btn.classList.remove('counting');
    r.cd.style.transition = 'none';
    r.cd.style.width = '0%';
    r.btn.disabled = false;
    r.label.textContent = m.button;
    s.busy = false;

    completeMission(i);
  };

  const onVisible = () => {
    if (document.visibilityState === 'visible' &&
        (Date.now() - startTime) / 1000 >= LINK_STAY_SECONDS) {
      finish();
    }
  };

  timer = setInterval(() => {
    const left = LINK_STAY_SECONDS - (Date.now() - startTime) / 1000;
    if (left <= 0) finish();
    else r.label.textContent = 'Stay ' + Math.ceil(left) + 's…';
  }, 250);

  document.addEventListener('visibilitychange', onVisible);
}

/* =========================================================
   10) Complete / update UI
   ========================================================= */
function completeMission(i) {
  const m = MISSIONS[i];
  const s = state[i];
  const r = refs[i];

  if (s.count >= m.limit) return;

  s.count++;
  haptic('medium');

  r.num.textContent = s.count;
  r.fill.style.width = ((s.count / m.limit) * 100) + '%';

  if (s.count >= m.limit) {
    r.card.classList.add('completed');
    r.btn.disabled = true;
    r.btn.classList.add('done');
    r.label.textContent = 'Completed ✓';
    haptic('success');
    toast('Mission completed! ✅');
  } else {
    toast('+1 point  •  ' + s.count + '/' + m.limit);
  }

  updateOverall();
  checkAllDone();
}

function updateOverall() {
  const total = MISSIONS.reduce((a, m) => a + m.limit, 0);
  const got = state.reduce((a, s) => a + s.count, 0);
  const doneMissions = state.filter((s, i) => s.count >= MISSIONS[i].limit).length;

  document.getElementById('overallText').textContent = got + ' / ' + total;
  document.getElementById('overallFill').style.width = ((got / total) * 100) + '%';
  document.getElementById('overallSub').textContent =
    doneMissions + ' of ' + MISSIONS.length + ' missions completed';
}

function checkAllDone() {
  const allDone = state.every((s, i) => s.count >= MISSIONS[i].limit);
  if (allDone && !congratsShown) {
    congratsShown = true;
    congratsAt = new Date();
    haptic('success');
    setTimeout(showCongrats, 550);
  }
}

/* =========================================================
   11) Congratulations
   ========================================================= */
function showCongrats() {
  const when = congratsAt || new Date();

  const dateStr = when.toLocaleDateString('en-GB', {
    day:'2-digit', month:'short', year:'numeric'
  });
  const timeStr = when.toLocaleTimeString('en-US', {
    hour:'2-digit', minute:'2-digit', hour12:true
  });

  document.getElementById('cgDate').textContent = dateStr;
  document.getElementById('cgTime').textContent = timeStr;
  document.getElementById('congrats').classList.add('show');
  launchConfetti();
}

function launchConfetti() {
  const layer = document.getElementById('confetti');
  const colors = ['#7c5cff','#22d3ee','#22c55e','#f59e0b','#ef4444','#ec4899','#ffffff'];

  for (let i = 0; i < 110; i++) {
    const p = document.createElement('i');
    p.className = 'confetti-piece';
    p.style.left = (Math.random() * 100) + '%';
    p.style.background = colors[(Math.random() * colors.length) | 0];
    p.style.width = (5 + Math.random() * 7) + 'px';
    p.style.height = (9 + Math.random() * 11) + 'px';
    p.style.animationDelay = (Math.random() * 1.8) + 's';
    p.style.animationDuration = (2.4 + Math.random() * 2.2) + 's';
    p.style.borderRadius = Math.random() > 0.6 ? '50%' : '2px';
    layer.appendChild(p);
  }
  setTimeout(() => { layer.innerHTML = ''; }, 6500);
}

document.getElementById('cgBtn').addEventListener('click', () => {
  haptic('light');
  document.getElementById('congrats').classList.remove('show');
  if (tg && tg.sendData) {
    try {
      tg.sendData(JSON.stringify({
        event:'all_missions_completed',
        at:(congratsAt || new Date()).toISOString()
      }));
    } catch (e) {}
  }
});

/* =========================================================
   12) Boot
   ========================================================= */
buildMissions();
updateOverall();
</script>
