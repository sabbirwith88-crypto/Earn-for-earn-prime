<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{
    --bg:#05060a;
    --panel:rgba(255,255,255,.035);
    --line:rgba(255,255,255,.14);
    --line-strong:rgba(255,255,255,.30);
    --ink:#eef1fb;
    --muted:#7d84a0;
    --ok:#22c55e;
  }
  html,body{margin:0;padding:0;height:100%}
  body{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
    background:var(--bg);
    color:var(--ink);
    min-height:100vh;
    overflow-x:hidden;
    position:relative;
    -webkit-font-smoothing:antialiased;
  }
  body::before{
    content:'';
    position:fixed;inset:0;z-index:0;pointer-events:none;
    background:
      linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px) 0 0/100% 44px,
      linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px) 0 0/44px 100%,
      radial-gradient(60% 34% at 50% -8%, rgba(167,139,250,.18), transparent 70%);
  }
  .app{
    position:relative;z-index:1;
    max-width:520px;margin:0 auto;
    padding:0 16px 40px;
  }

  /* ---------- Header ---------- */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:22px 2px 16px;margin-bottom:18px;
    border-bottom:1px dashed var(--line);
  }
  .topbar .brand{display:flex;align-items:center;gap:12px;min-width:0}
  .logo{
    width:44px;height:44px;flex:0 0 44px;border-radius:11px;
    display:grid;place-items:center;font-size:20px;
    background:var(--panel);
    border:1.5px solid var(--line-strong);
  }
  .topbar h1{margin:0;font-size:17.5px;font-weight:700;letter-spacing:.1px;font-family:'Space Grotesk',sans-serif}
  .topbar p{margin:3px 0 0;font-size:11.5px;color:var(--muted);font-weight:500}
  .topbar .tag{
    flex:0 0 auto;font-family:'Space Grotesk',sans-serif;font-size:11px;font-weight:600;
    color:var(--muted);border:1px dashed var(--line-strong);border-radius:999px;
    padding:6px 11px;white-space:nowrap;
  }

  /* ---------- Overall progress ---------- */
  .progress-card{
    position:relative;
    background:var(--panel);
    border:1px dashed var(--line-strong);
    border-radius:14px;
    padding:16px 16px 14px;
    margin-bottom:20px;
  }
  .p-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
  .p-row .lbl{font-size:12.5px;font-weight:600;color:var(--muted);font-family:'Space Grotesk',sans-serif;letter-spacing:.1px}
  .p-row .val{font-size:19px;font-weight:700;font-family:'Space Grotesk',sans-serif;color:var(--ink);font-variant-numeric:tabular-nums}
  .p-meter{position:relative;height:13px;border-radius:4px;background:rgba(255,255,255,.06);overflow:hidden}
  .p-meter-fill{
    position:relative;z-index:1;height:100%;width:0;
    background:linear-gradient(90deg,#a78bfa,#60a5fa);
    transition:width .6s cubic-bezier(.2,.8,.2,1);
  }
  .p-meter::after{
    content:'';position:absolute;inset:0;z-index:2;pointer-events:none;
    background-image:repeating-linear-gradient(90deg, transparent 0 calc(100%/6 - 2px), var(--bg) calc(100%/6 - 2px) calc(100%/6));
  }
  .p-sub{margin-top:9px;font-size:11.5px;color:var(--muted);font-weight:500}

  /* ---------- Mission ticket ---------- */
  #missions{counter-reset:mission}
  .mission{
    position:relative;
    counter-increment:mission;
    display:flex;align-items:stretch;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:16px;
    margin-bottom:16px;
    overflow:hidden;
    animation:rise .5s cubic-bezier(.2,.8,.2,1) both;
    transition:border-color .3s, background .3s, box-shadow .3s;
  }
  @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  .mission::before,.mission::after{
    content:'';position:absolute;left:78px;margin-left:-7px;
    width:14px;height:14px;border-radius:50%;background:var(--bg);z-index:3;
  }
  .mission::before{top:-7px}
  .mission::after{bottom:-7px}
  .mission.completed{
    border-color:rgba(34,197,94,.45);
    box-shadow:0 10px 26px rgba(34,197,94,.14);
  }

  .m-stub{
    flex:0 0 78px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;
    padding:16px 6px;
    background:linear-gradient(165deg, color-mix(in srgb, var(--macc1,#a78bfa) 88%, black), color-mix(in srgb, var(--macc1,#a78bfa) 58%, black));
  }
  .m-stub .m-icon{
    width:34px;height:34px;display:grid;place-items:center;font-size:18px;
    background:rgba(0,0,0,.22);border-radius:9px;
  }
  .mission:nth-child(even) .m-stub .m-icon{border-radius:50%}
  .m-stub .m-no{
    font-family:'Space Grotesk',sans-serif;font-size:10px;font-weight:600;
    letter-spacing:.3px;color:rgba(255,255,255,.82);font-variant-numeric:tabular-nums;
  }
  .mission.completed .m-stub{filter:saturate(.5) brightness(.75)}

  .m-perf{flex:0 0 0;border-left:2px dashed rgba(255,255,255,.30)}

  .m-body{flex:1;min-width:0;padding:14px 14px 14px 16px}
  .m-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
  .m-text{flex:1;min-width:0}
  .m-text h3{margin:0;font-size:13.5px;font-weight:600;line-height:1.32;font-family:'Space Grotesk',sans-serif}
  .m-text p{margin:5px 0 0;font-size:11.5px;color:var(--muted);line-height:1.4;font-weight:500}
  .m-badge{
    flex:0 0 auto;font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:700;
    color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap;padding-top:1px;
  }
  .m-badge span{color:var(--muted);font-weight:500}
  .mission.completed .m-badge b{color:#5ee89b}

  .m-track{position:relative;height:8px;border-radius:3px;background:rgba(255,255,255,.07);overflow:hidden;margin-top:12px}
  .m-fill{
    position:relative;z-index:1;height:100%;width:0;
    background:var(--macc1,#a78bfa);
    transition:width .5s cubic-bezier(.2,.8,.2,1);
  }
  .mission.completed .m-fill{background:#22c55e}
  .m-track::after{
    content:'';position:absolute;inset:0;z-index:2;pointer-events:none;
    background-image:repeating-linear-gradient(90deg, transparent 0 calc(100%/6 - 2px), var(--bg) calc(100%/6 - 2px) calc(100%/6));
  }

  .m-btn{
    position:relative;overflow:hidden;
    display:flex;align-items:center;justify-content:center;
    width:100%;height:44px;margin-top:12px;
    border:1px solid transparent;border-radius:10px;
    font-family:'Space Grotesk',sans-serif;font-size:13.5px;font-weight:600;letter-spacing:.1px;
    color:#05060a;cursor:pointer;user-select:none;
    background:var(--macc1,#a78bfa);
    transition:transform .15s ease, background .3s, color .3s, border-color .3s;
  }
  .m-btn > span:not(.cd-fill){position:relative;z-index:1}
  .m-btn:active{transform:scale(.972)}
  .m-btn:disabled{cursor:default}
  .m-btn.loading{filter:saturate(.5) brightness(.85)}
  .m-btn.counting{
    background:rgba(255,255,255,.06);
    color:var(--ink);
    border-color:var(--line-strong);
  }
  .m-btn.done{
    background:rgba(34,197,94,.14);
    color:#5ee89b;
    border-color:rgba(34,197,94,.38);
  }
  .cd-fill{
    position:absolute;left:0;top:0;bottom:0;width:0;z-index:0;
    background:rgba(255,255,255,.16);
    pointer-events:none;
  }
  .spinner{
    display:none;width:14px;height:14px;margin-right:8px;border-radius:50%;
    border:2px solid rgba(5,6,10,.35);border-top-color:#05060a;
    animation:spin .7s linear infinite;
  }
  .m-btn.loading .spinner{display:inline-block}
  .m-btn.counting .spinner{border-color:rgba(255,255,255,.3);border-top-color:#fff}
  .m-btn.loading .spinner{border-color:rgba(255,255,255,.3);border-top-color:#fff}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* six ticket identities, in mission order */
  .mission:nth-child(1){--macc1:#a78bfa}
  .mission:nth-child(2){--macc1:#38bdf8}
  .mission:nth-child(3){--macc1:#fbbf24}
  .mission:nth-child(4){--macc1:#fb7185}
  .mission:nth-child(5){--macc1:#a3e635}
  .mission:nth-child(6){--macc1:#60a5fa}

  /* ---------- Toast ---------- */
  .toast{
    position:fixed;left:50%;bottom:28px;z-index:70;
    transform:translate(-50%,22px);opacity:0;
    padding:11px 18px;border-radius:10px;
    background:#0c0e16;
    border:1px dashed var(--line-strong);
    font-size:12.5px;font-weight:600;color:var(--ink);white-space:nowrap;
    font-family:'Space Grotesk',sans-serif;
    transition:opacity .3s, transform .3s cubic-bezier(.2,.8,.2,1);
    pointer-events:none;
    max-width:90vw;text-align:center;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}

  /* ---------- Congratulations ---------- */
  .congrats{
    position:fixed;inset:0;z-index:65;
    display:none;place-items:center;padding:26px;
    background:rgba(3,4,8,.82);
  }
  .congrats.show{display:grid;animation:fadeIn .3s ease both}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .cg-card{
    position:relative;width:100%;max-width:360px;text-align:center;
    padding:30px 22px 24px;border-radius:18px;
    background:#0b0d15;
    border:1px dashed var(--line-strong);
    box-shadow:0 30px 70px rgba(0,0,0,.6);
    animation:pop .55s cubic-bezier(.2,1.2,.4,1) both;
  }
  @keyframes pop{
    0%{opacity:0;transform:scale(.85) translateY(20px)}
    100%{opacity:1;transform:scale(1)}
  }
  .cg-stamp{
    width:92px;height:92px;margin:0 auto 16px;
    border:3px dashed #a3e635;border-radius:50%;
    display:grid;place-items:center;
    transform:rotate(-7deg);
    color:#a3e635;
  }
  .cg-stamp-icon{font-size:27px;line-height:1}
  .cg-stamp-text{
    margin-top:2px;font-family:'Space Grotesk',sans-serif;font-size:10px;
    font-weight:700;letter-spacing:1.4px;text-transform:uppercase;
  }
  .cg-card h2{
    margin:0 0 8px;font-size:22px;font-weight:700;letter-spacing:.1px;
    font-family:'Space Grotesk',sans-serif;color:var(--ink);
  }
  .cg-card p{margin:0 0 18px;font-size:13px;line-height:1.6;color:var(--muted);font-weight:500}
  .cg-stats{display:flex;margin-bottom:16px;border-top:1px dashed var(--line);border-bottom:1px dashed var(--line);padding:12px 0}
  .cg-stat{flex:1;border-right:1px dashed var(--line)}
  .cg-stat:last-child{border-right:none}
  .cg-stat b{display:block;font-family:'Space Grotesk',sans-serif;font-size:17px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
  .cg-stat span{display:block;margin-top:3px;font-size:10px;color:var(--muted);font-weight:600;letter-spacing:.2px}

  .cg-when{margin-bottom:20px;text-align:left}
  .cg-when-item{display:flex;justify-content:space-between;align-items:center;padding:5px 0;font-family:'Space Grotesk',sans-serif}
  .cg-when-item .k{font-size:11.5px;color:var(--muted);font-weight:600}
  .cg-when-item .v{font-size:12.5px;color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}

  .cg-btn{
    width:100%;height:48px;border:none;border-radius:10px;
    font-family:'Space Grotesk',sans-serif;font-size:14px;font-weight:700;letter-spacing:.1px;color:#05060a;
    background:#a3e635;
    cursor:pointer;transition:transform .15s;
  }
  .cg-btn:active{transform:scale(.97)}

  /* ---------- Confetti ---------- */
  #confetti{position:fixed;inset:0;z-index:80;overflow:hidden;pointer-events:none}
  .confetti-piece{
    position:absolute;top:-24px;display:block;border-radius:2px;
    opacity:0;animation:fall linear forwards;
  }
  @keyframes fall{
    0%{opacity:1;transform:translateY(-24px) rotate(0deg)}
    100%{opacity:0;transform:translateY(110vh) rotate(760deg)}
  }

  .footer{
    text-align:center;margin-top:22px;
    font-size:10.5px;color:rgba(125,132,160,.7);font-weight:600;letter-spacing:.4px;
    font-family:'Space Grotesk',sans-serif;
  }
</style>
</head>
<body>

<div class="app">
  <!-- Header -->
  <header class="topbar">
    <div class="brand">
      <div class="logo">🎯</div>
      <div>
        <h1>Mission Log</h1>
        <p>Clear every mission to unlock your reward</p>
      </div>
    </div>
    <span class="tag">6 missions</span>
  </header>

  <!-- Overall progress -->
  <section class="progress-card">
    <div class="p-row">
      <span class="lbl">Overall progress</span>
      <span class="val" id="overallText">0 / 30</span>
    </div>
    <div class="p-meter"><div class="p-meter-fill" id="overallFill"></div></div>
    <div class="p-sub" id="overallSub">0 of 6 missions completed</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Congratulations -->
<div class="congrats" id="congrats">
  <div class="cg-card">
    <div class="cg-stamp">
      <div>
        <div class="cg-stamp-icon">✓</div>
        <div class="cg-stamp-text">Cleared</div>

      <div class="cg-stat"><b>6/6</b><span>Missions</span></div>
      <div class="cg-stat"><b>30/30</b><span>Points</span></div>
      <div class="cg-stat"><b>100%</b><span>Done</span></div>
    </div>

    <!-- Date & Time when congratulated -->
    <div class="cg-when">
      <div class="cg-when-item">
        <span class="k">Date</span>
        <span class="v" id="cgDate">—</span>
      </div>
      <div class="cg-when-item">
        <span class="k">Time</span>
        <span class="v" id="cgTime">—</span>
      </div>
    </div>

    <button class="cg-btn" id="cgBtn">Claim reward</button>
  </div>
</div>

<div id="confetti"></div>


<script>
/* =========================================================
   1) Telegram Mini App init
   ========================================================= */
const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
if (tg) {
  try {
    tg.ready();
    tg.expand();
    if (tg.setHeaderColor) tg.setHeaderColor('#05060a');
    if (tg.setBackgroundColor) tg.setBackgroundColor('#05060a');
    if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();
  } catch (e) {}
}

/* =========================================================
   2) Ad network config
   ========================================================= */
const ADSGRAM_BLOCK_ID = '30645';
const ADSBITVEX_APP_ID = '000274';
const MONETAG_ZONE     = '10541383';

/* =========================================================
   3) Mission list
   ========================================================= */
const MISSIONS = [
  {
    id: 1,
    kind: 'ad',
    provider: 'adsgram',
    icon: '📺',
    title: 'Watch Adsgram Ads',
    desc: 'Watch a full Adsgram ad to earn 1 point',
    button: 'Watch Adsgram Ads',
    limit: 5
  },
  {
    id: 2,
    kind: 'link',
    icon: '🔗',
    title: 'Click The Link & Stay 5 Seconds',
    desc: 'Open the link and stay there for 5 seconds',
    button: 'Click The Link',
    limit: 5,
    url: 'https://bowlsharp.com/yg0bftcw?key=568ce0b3290df6de10b74a13af0c817c'
  },
  {
    id: 3,
    kind: 'ad',
    provider: 'adsbitvex',
    icon: '🎬',
    title: 'Watch Adsbitbex Ads',
    desc: 'Watch a full Adsbitbex ad to earn 1 point',
    button: 'Watch Adsbitbex Ads',
    limit: 5
  },
  {
    id: 4,
    kind: 'link',
    icon: '🌐',
    title: 'Click The Link & Stay 5 Seconds',
    desc: 'Open the link and stay there for 5 seconds',
    button: 'Click The Link',
    limit: 5,
    url: 'https://omg10.com/4/10686606'
  },
  {
    id: 5,
    kind: 'ad',
    provider: 'monetag',
    icon: '💎',
    title: 'Watch Monetag Ads',
    desc: 'Watch a full Monetag ad to earn 1 point',
    button: 'Watch Monetag Ads',
    limit: 5
  },
  {
    id: 6,
    kind: 'link',
    icon: '🚀',
    title: 'Click The Link & Stay 5 Seconds',
    desc: 'Open the link and stay there for 5 seconds',
    button: 'Click The Link',
    limit: 5,
    url: 'https://wwp.giriubin.com/redirect-zone/31c41a18'
  }
];

const LINK_STAY_SECONDS = 5;

/* =========================================================
   4) State
   ========================================================= */
const state = MISSIONS.map(() => ({ count: 0, busy: false }));
const refs = [];
let congratsShown = false;
let congratsAt = null;   // stores Date when congrats was triggered

/* =========================================================
   5) Helpers
   ========================================================= */
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

function haptic(type) {
  if (!tg || !tg.HapticFeedback) return;
  try {
    if (type === 'light') tg.HapticFeedback.impactOccurred('light');
    else if (type === 'medium') tg.HapticFeedback.impactOccurred('medium');
    else if (type === 'heavy') tg.HapticFeedback.impactOccurred('heavy');
    else if (type === 'success') tg.HapticFeedback.notificationOccurred('success');
    else if (type === 'error') tg.HapticFeedback.notificationOccurred('error');
  } catch (e) {}
}

function openLink(url) {
  if (!url) return;
  try {
    if (tg && tg.openLink) tg.openLink(url, { try_instant_view: false });
    else window.open(url, '_blank');
  } catch (e) {
    try { window.open(url, '_blank'); } catch (e2) {}
  }
}

async function waitFor(checkFn, tries, delay) {
  tries = tries || 24;
  delay = delay || 200;
  for (let i = 0; i < tries; i++) {
    try { if (checkFn()) return true; } catch (e) {}
    await sleep(delay);
  }
  return false;
}

let toastTimer = null;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 1900);
}

/* =========================================================
   6) ADSGRAM  —  Rewarded ad
   ========================================================= */
let adsgramController = null;

function initAdsgram() {
  if (adsgramController) return adsgramController;
  if (window.Adsgram && typeof window.Adsgram.init === 'function') {
    try {
      adsgramController = window.Adsgram.init({ blockId: ADSGRAM_BLOCK_ID });
    } catch (e) {
      adsgramController = null;
    }
  }
  return adsgramController;
}
initAdsgram();

function showAdsgramAd() {
  return new Promise((resolve) => {
    let settled = false;
    const done = (v) => { if (!settled) { settled = true; resolve(v); } };

    // if SDK is not available at all, fail fast
    if (!window.Adsgram || typeof window.Adsgram.init !== 'function') {
      done(false); return;
    }

    setTimeout(() => done(false), 45000);

    const ctrl = initAdsgram();
    if (!ctrl || typeof ctrl.show !== 'function') { done(false); return; }

    try {
      if (typeof ctrl.on === 'function') {
        ctrl.on('onReward', () => done(true));
        ctrl.on('onError',  () => done(false));
      }
    } catch (e) {}

    try {
      const p = ctrl.show();
      if (p && typeof p.then === 'function') {
        p.then((result) => {
          if (result && result.done === true) done(true);
          else done(false);
        }).catch(() => done(false));
      } else {
        setTimeout(() => done(false), 35000);
      }
    } catch (e) {
      done(false);
    }
  });
}

/* =========================================================
   7) ADSBITVEX  —  window.showadsbitvex()
   ========================================================= */
function showAdsbitvexAd() {
  return new Promise(async (resolve) => {
    let settled = false;
    const done = (v) => { if (!settled) { settled = true; resolve(v); } };

    setTimeout(() => done(false), 90000);

    const ready = await waitFor(
      () => typeof window.showadsbitvex === 'function', 24, 200
    );
    if (!ready) { done(false); return; }

    try {
      window.showadsbitvex()
        .then(() => done(true))
        .catch(() => done(false));
    } catch (e) {
      done(false);
    }
  });
}

/* =========================================================
   8) MONETAG  —  show_10541383()
   ========================================================= */
function showMonetagAd() {
  return new Promise(async (resolve) => {
    let settled = false;
    const done = (v) => { if (!settled) { settled = true; resolve(v); } };

    setTimeout(() => done(false), 90000);

    const ready = await waitFor(
      () => typeof window.show_10541383 === 'function', 24, 200
    );
    if (!ready) { done(false); return; }

    try {
      window.show_10541383()
        .then(() => done(true))
        .catch(() => done(false));
    } catch (e) {
      done(false);
    }
  });
}

/* =========================================================
   9) Build mission cards
   ========================================================= */
function buildMissions() {
  const wrap = document.getElementById('missions');

  MISSIONS.forEach((m, i) => {
    const card = document.createElement('article');
    card.className = 'mission';
    card.style.animationDelay = (i * 80) + 'ms';

    card.innerHTML = `
      <div class="m-stub">
        <div class="m-icon">${m.icon}</div>
        <div class="m-no">No.${String(i + 1).padStart(2, '0')}</div>
      </div>
      <div class="m-perf"></div>
      <div class="m-body">
        <div class="m-top">
          <div class="m-text">
            <h3>${m.title}</h3>
            <p>${m.desc}</p>
          </div>
          <div class="m-badge"><b>0</b><span>/${m.limit}</span></div>
        </div>
        <div class="m-track"><div class="m-fill"></div></div>
        <button class="m-btn" type="button">
          <span class="cd-fill"></span>
          <span class="spinner"></span>
          <span class="btn-label">${m.button}</span>
        </button>
      </div>
    `;

    const ref = {
      card,
      num:  card.querySelector('.m-badge b'),
      fill: card.querySelector('.m-fill'),
      btn:  card.querySelector('.m-btn'),
      label:card.querySelector('.btn-label'),
      cd:   card.querySelector('.cd-fill')
    };

    ref.btn.addEventListener('click', () => onMissionClick(i));

    refs.push(ref);
    wrap.appendChild(card);
  });
}

/* =========================================================
   10) Click router
   ========================================================= */
function onMissionClick(i) {
  const m = MISSIONS[i];
  const s = state[i];
  if (s.busy || s.count >= m.limit) return;

  if (m.kind === 'ad') runAdMission(i);
  else runLinkMission(i);
}

/* ---------- Ad mission (with Adsgram → Monetag fallback) ---------- */
async function runAdMission(i) {
  const m = MISSIONS[i];
  const s = state[i];
  const r = refs[i];

  s.busy = true;
  haptic('light');

  r.btn.classList.add('loading');
  r.btn.disabled = true;

  let rewarded = false;

  if (m.provider === 'adsgram') {
    r.label.textContent = 'Loading Adsgram ad…';
    rewarded = await showAdsgramAd();

    // 🔁 Fallback: Adsgram didn't show / didn't load → try Monetag
    if (!rewarded) {
      r.label.textContent = 'Adsgram unavailable — trying Monetag…';
      toast('Adsgram failed — switching to Monetag');
      await sleep(300);
      rewarded = await showMonetagAd();
    }

  } else if (m.provider === 'adsbitvex') {
    r.label.textContent = 'Loading Adsbitbex ad…';
    rewarded = await showAdsbitvexAd();

  } else if (m.provider === 'monetag') {
    r.label.textContent = 'Loading Monetag ad…';
    rewarded = await showMonetagAd();
  }

  r.btn.classList.remove('loading');
  r.btn.disabled = false;
  r.label.textContent = m.button;
  s.busy = false;

  if (rewarded) {
    completeMission(i);
  } else {
    haptic('error');
    toast('Ad not completed — please try again');
  }
}

/* ---------- Link mission (click once → 1 point) ---------- */
function runLinkMission(i) {
  const m = MISSIONS[i];
  const s = state[i];
  const r = refs[i];

  s.busy = true;
  haptic('light');

  // open the link in Telegram's in-app browser
  if (m.url) openLink(m.url);

  r.btn.classList.add('counting');
  r.btn.disabled = true;

  // progress fill animation
  r.cd.style.transition = 'none';
  r.cd.style.width = '0%';
  void r.cd.offsetWidth;
  r.cd.style.transition = 'width ' + LINK_STAY_SECONDS + 's linear';
  r.cd.style.width = '100%';

  const startTime = Date.now();
  r.label.textContent = 'Stay ' + LINK_STAY_SECONDS + 's…';

  let finished = false;
  let timer = null;

  // 🔒 single-shot finish: prevents double point counting
  const finish = () => {
    if (finished) return;
    finished = true;

    if (timer) clearInterval(timer);
    document.removeEventListener('visibilitychange', onVisible);

    r.btn.classList.remove('counting');
    r.cd.style.transition = 'none';
    r.cd.style.width = '0%';
    r.btn.disabled = false;
    r.label.textContent = m.button;
    s.busy = false;

    completeMission(i);   // ← exactly 1 point
  };

  const onVisible = () => {
    if (document.visibilityState === 'visible' &&
        (Date.now() - startTime) / 1000 >= LINK_STAY_SECONDS) {
      finish();
    }
  };

  timer = setInterval(() => {
    const elapsed = (Date.now() - startTime) / 1000;
    const left = LINK_STAY_SECONDS - elapsed;

    if (left <= 0) {
      finish();
    } else {
      r.label.textContent = 'Stay ' + Math.ceil(left) + 's…';
    }
  }, 250);

  document.addEventListener('visibilitychange', onVisible);
}

/* =========================================================
   11) Complete / update UI
   ========================================================= */
function completeMission(i) {
  const m = MISSIONS[i];
  const s = state[i];
  const r = refs[i];

  if (s.count >= m.limit) return;

  s.count++;
  haptic('medium');

  r.num.textContent = s.count;
  r.fill.style.width = ((s.count / m.limit) * 100) + '%';

  if (s.count >= m.limit) {
    r.card.classList.add('completed');
    r.btn.disabled = true;
    r.btn.classList.add('done');
    r.label.textContent = 'Completed ✓';
    haptic('success');
    toast('Mission completed! ✅');
  } else {
    toast('+1 point  •  ' + s.count + '/' + m.limit);
  }

  updateOverall();
  checkAllDone();
}

function updateOverall() {
  const total = MISSIONS.reduce((a, m) => a + m.limit, 0);
  const got = state.reduce((a, s) => a + s.count, 0);
  const doneMissions = state.filter((s, i) => s.count >= MISSIONS[i].limit).length;
  const pct = total ? got / total : 0;

  document.getElementById('overallText').textContent = got + ' / ' + total;
  document.getElementById('overallFill').style.width = (pct * 100) + '%';
  document.getElementById('overallSub').textContent =
    doneMissions + ' of ' + MISSIONS.length + ' missions completed';

  const ring = document.getElementById('ringFill');
  if (ring) ring.style.strokeDashoffset = (113.1 * (1 - pct)).toFixed(1);
  const ringPct = document.getElementById('ringPct');
  if (ringPct) ringPct.textContent = Math.round(pct * 100) + '%';
}

function checkAllDone() {
  const allDone = state.every((s, i) => s.count >= MISSIONS[i].limit);
  if (allDone && !congratsShown) {
    congratsShown = true;
    congratsAt = new Date();   // ⏱ capture the moment
    haptic('success');
    setTimeout(showCongrats, 550);
  }
}

/* =========================================================
   12) Congratulations + confetti + date/time stamp
   ========================================================= */
function showCongrats() {
  const when = congratsAt || new Date();

  // date (e.g. 18 Sep 2026)
  const dateStr = when.toLocaleDateString('en-GB', {
    day: '2-digit', month: 'short', year: 'numeric'
  });

  // time (e.g. 09:42 PM)
  const timeStr = when.toLocaleTimeString('en-US', {
    hour: '2-digit', minute: '2-digit', hour12: true
  });

  document.getElementById('cgDate').textContent = dateStr;
  document.getElementById('cgTime').textContent = timeStr;

  document.getElementById('congrats').classList.add('show');
  launchConfetti();
}

function launchConfetti() {
  const layer = document.getElementById('confetti');
  const colors = ['#a78bfa', '#38bdf8', '#fbbf24', '#fb7185', '#a3e635', '#60a5fa', '#ffffff'];

  for (let i = 0; i < 110; i++) {
    const p = document.createElement('i');
    p.className = 'confetti-piece';
    p.style.left = (Math.random() * 100) + '%';
    p.style.background = colors[(Math.random() * colors.length) | 0];
    p.style.width = (5 + Math.random() * 7) + 'px';
    p.style.height = (9 + Math.random() * 11) + 'px';
    p.style.animationDelay = (Math.random() * 1.8) + 's';
    p.style.animationDuration = (2.4 + Math.random() * 2.2) + 's';
    p.style.borderRadius = Math.random() > 0.6 ? '50%' : '2px';
    layer.appendChild(p);
  }

  setTimeout(() => { layer.innerHTML = ''; }, 6500);
}

document.getElementById('cgBtn').addEventListener('click', () => {
  haptic('light');
  document.getElementById('congrats').classList.remove('show');

  // notify the bot with completion timestamp
  if (tg && tg.sendData) {
    try {
      tg.sendData(JSON.stringify({
        event: 'all_missions_completed',
        at: (congratsAt || new Date()).toISOString()
      }));
    } catch (e) {}
  }
});

/* =========================================================
   13) Boot
   ========================================================= */
buildMissions();
updateOverall();

window.addEventListener('load', () => { initAdsgram(); });
setTimeout(() => { initAdsgram(); }, 1500);
</script>
