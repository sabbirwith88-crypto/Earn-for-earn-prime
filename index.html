<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>PMER</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://sad.adsgram.ai/js/sad.min.js"></script>
<script src="https://sdk.adsbitvex.com/functions/v1/ad-script?appid=000274"></script>
<script src='//libtl.com/sdk.js' data-zone='10541383' data-sdk='show_10541383'></script>
<script src="https://ad.gigapub.tech/script?id=6471"></script>
<script src="https://js.onclckvd.com/in-stream-ad-admanager/tma.js"></script>
<style>
:root{
  --bg:#F5F4FB; --card:#FFFFFF; --ink:#16132F; --muted:#6C6989; --line:#E7E4F4;
  --brand:#6A3DF0; --brand-soft:#EEE9FF; --gold:#FFC53D; --gold-ink:#3D2A00;
  --jade:#34C48A; --jade-soft:#E1F6EC; --jade-ink:#003D26;
  --ok:#0F9F6E; --ok-soft:#E1F6EC; --bad:#DC3B4B; --bad-soft:#FDE9EB;
  --hero:#17133A; --nav:rgba(255,255,255,.94);
  --shadow:0 1px 2px rgba(23,19,58,.05),0 10px 24px -14px rgba(23,19,58,.22);
  color-scheme:light;
}
[data-theme="dark"]{
  --bg:#0E0B22; --card:#181433; --ink:#F2F0FC; --muted:#9F9AC4; --line:#2B2652;
  --brand:#9273FF; --brand-soft:#261F55; --ok:#37C58F; --ok-soft:#0F3527; --bad:#FF6B7A; --bad-soft:#3D1620;
  --hero:#1F1958; --nav:rgba(24,20,51,.94); --shadow:0 1px 2px rgba(0,0,0,.4);
  color-scheme:dark;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink);font:500 15px/1.45 'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased;touch-action:manipulation;overscroll-behavior-y:none}
button,input,select{font:inherit;color:inherit}
h1,h2,h3,.num{font-family:'Sora','Manrope',sans-serif;letter-spacing:-.01em}
:focus-visible{outline:2.5px solid var(--brand);outline-offset:2px}
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ico.sm{width:18px;height:18px}
.mut{color:var(--muted)}
.grow{flex:1;min-width:0}
.row{display:flex;align-items:center;gap:12px}

#splash,#gate{position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:32px;text-align:center;transition:opacity .45s ease}
#splash{background:radial-gradient(circle at 50% 36%,rgba(106,61,240,.20),transparent 58%),var(--bg)}
#splash.leave{opacity:0;pointer-events:none}
.sl{position:relative;width:112px;height:112px;margin-bottom:26px;animation:pop .7s cubic-bezier(.2,1.2,.4,1) both}
.sl .logo{width:112px;height:112px;filter:drop-shadow(0 20px 26px rgba(106,61,240,.45))}
.sl::before,.sl::after{content:"";position:absolute;inset:-14px;border-radius:38%;border:1.5px solid var(--brand);opacity:0;animation:ring 2.4s ease-out infinite}
.sl::after{animation-delay:1.2s}
#splash .word{font:800 30px 'Sora',sans-serif;letter-spacing:.32em;text-indent:.32em;animation:rise .6s .25s cubic-bezier(.2,.8,.2,1) both}
#splash .tag{margin-top:8px;color:var(--muted);font-size:13.5px;font-weight:600;letter-spacing:.06em;animation:rise .6s .4s cubic-bezier(.2,.8,.2,1) both}
#splash .bar{width:132px;height:4px;border-radius:4px;background:var(--line);overflow:hidden;margin:34px 0 0;animation:rise .6s .55s both}
#splash .bar i{display:block;height:100%;width:40%;background:var(--brand);border-radius:4px;animation:slide 1s ease-in-out infinite}
#gate{gap:14px}
#gate .logo{width:84px;height:84px;filter:drop-shadow(0 16px 22px rgba(106,61,240,.4))}
#gate h1{font-size:22px}
#gate p{max-width:300px;color:var(--muted)}
.logo{display:block;border-radius:30%;overflow:hidden;flex:none;line-height:0}
.logo .mark{width:100%;height:100%;display:block}
.logo img{width:100%;height:100%;object-fit:cover;display:block}

#app{max-width:480px;margin:0 auto;padding:16px 16px calc(104px + env(safe-area-inset-bottom))}
.page>h1{font-size:26px;font-weight:800;margin:6px 0 4px}
.page>.sub{color:var(--muted);margin-bottom:18px;max-width:40ch}
.page.enter{animation:pagein .35s cubic-bezier(.2,.8,.2,1)}
.page.enter .list>*,.page.enter .tiles>*,.page.enter .stats>*,.page.enter .menu{animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
.page.enter .list>*:nth-child(2),.page.enter .tiles>*:nth-child(2),.page.enter .stats>*:nth-child(2){animation-delay:.04s}
.page.enter .list>*:nth-child(3),.page.enter .tiles>*:nth-child(3),.page.enter .stats>*:nth-child(3){animation-delay:.08s}
.page.enter .list>*:nth-child(4),.page.enter .tiles>*:nth-child(4){animation-delay:.12s}
.page.enter .list>*:nth-child(n+5){animation-delay:.16s}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.brand{display:flex;align-items:center;gap:10px;font:800 19px 'Sora',sans-serif;letter-spacing:.06em}
.brand .logo{width:38px;height:38px;box-shadow:0 6px 14px -6px rgba(106,61,240,.6)}
.icon-btn{width:40px;height:40px;border-radius:14px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;transition:transform .12s}
.icon-btn:active{transform:scale(.92)}

.coin{width:22px;height:22px;border-radius:50%;flex:none;display:inline-grid;place-items:center;font:800 8.5px/1 'Sora',sans-serif;color:#5C4000;background:radial-gradient(circle at 30% 28%,#FFE79B,#FFC53D 58%,#E39D00);box-shadow:inset 0 0 0 2px rgba(255,255,255,.4),inset 0 -2px 0 rgba(0,0,0,.12)}
.coin.rj{color:#003D26;background:radial-gradient(circle at 30% 28%,#A8F0D0,#34C48A 58%,#0F9F6E)}
.coin.lg{width:34px;height:34px;font-size:12px}
[data-theme="dark"] .coin.rj{color:#C0FFDD}

.hero{position:relative;overflow:hidden;background:var(--hero);color:#fff;border-radius:28px;padding:22px 20px 20px;margin-bottom:14px}
.hero .rings{position:absolute;right:-30px;top:-30px;width:240px;height:240px;fill:none;stroke:#fff;stroke-opacity:.12;stroke-width:1.5;pointer-events:none}
.hero.ping .rings circle{animation:ping 1s ease-out}
.hero.ping .rings circle:nth-child(2){animation-delay:.1s}.hero.ping .rings circle:nth-child(3){animation-delay:.2s}.hero.ping .rings circle:nth-child(4){animation-delay:.3s}
.hero-label{font-size:13px;color:#fff;opacity:.72}
.hero-amt{display:flex;align-items:center;gap:10px;margin:6px 0 2px}
.hero-amt .num{font-size:40px;font-weight:800;line-height:1.1}
.hero-sub{font-size:13px;opacity:.72;margin-bottom:18px}
.hero-actions{display:flex;gap:10px}
.hero-actions .btn{flex:1}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 12px}
.stat .num{font-size:19px;font-weight:700}
.stat small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow);transition:transform .15s}
.tile:active{transform:scale(.96)}
.tile b{display:block;font:700 15px 'Sora',sans-serif}
.tile span.mut{display:block;font-size:13px;line-height:1.35;margin-top:2px}

.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow)}
button.card{width:100%;text-align:left;display:flex;align-items:center;gap:12px;cursor:pointer;transition:transform .15s}
button.card:active{transform:scale(.98)}
button.card>.ico:last-child{color:var(--muted);width:18px;height:18px}
.list{display:flex;flex-direction:column;gap:12px}
.tbadge{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;flex:none;color:var(--tc,var(--brand));background:var(--brand-soft);background:color-mix(in srgb,var(--tc,var(--brand)) 15%,transparent)}
.t-join{--tc:#6A3DF0}.t-reaction{--tc:#E0457B}.t-view{--tc:#0C93A0}.t-conditions{--tc:#D18100}.t-ads{--tc:#6A3DF0}.t-website{--tc:#0B7A5A}.t-youtube{--tc:#E02B2B}.t-linkad{--tc:#0C93A0}
[data-theme="dark"] .t-join,[data-theme="dark"] .t-ads{--tc:#A58CFF}
.reward{display:inline-flex;align-items:center;gap:6px;background:#FFF3D1;background:color-mix(in srgb,var(--gold) 22%,transparent);color:#8A5A00;font:700 13px 'Sora',sans-serif;padding:6px 10px 6px 6px;border-radius:999px;white-space:nowrap}
.reward.rj{background:color-mix(in srgb,var(--jade) 22%,transparent);color:#00714A}
[data-theme="dark"] .reward{color:#FFD879}
[data-theme="dark"] .reward.rj{color:#8CFFC9}
.reward .coin{width:18px;height:18px;font-size:7px}
.card h3{font-size:15px;font-weight:700;line-height:1.3;word-break:break-word}
.card .meta{font-size:13px;color:var(--muted);margin-top:2px}
.bar{height:6px;border-radius:6px;background:var(--line);overflow:hidden;margin:12px 0}
.bar i{display:block;height:100%;background:var(--brand);border-radius:6px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.bar.jade i{background:var(--jade)}
.actions{display:flex;gap:10px;margin-top:14px}
.actions .btn{flex:1}
.adgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.adgrid .btn{padding:11px 6px;font-size:12.5px;border-radius:12px}
.adgrid .btn.done{background:var(--ok-soft);color:var(--ok)}
.steps{list-style:none;margin-top:12px;display:flex;flex-direction:column;gap:8px;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:10px;font-size:13.5px;line-height:1.4}
.steps li::before{content:counter(s);flex:none;width:20px;height:20px;border-radius:50%;background:var(--brand-soft);color:var(--brand);font:700 11px/20px 'Sora',sans-serif;text-align:center}

.btn{appearance:none;border:0;border-radius:14px;padding:13px 16px;font:700 14.5px/1.1 'Manrope',sans-serif;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;transition:transform .15s,opacity .2s,background .25s,box-shadow .25s;text-align:center}
.btn:active{transform:scale(.96)}
.btn[disabled]{opacity:.55;cursor:not-allowed;transform:none}
.btn-primary{background:var(--brand);color:#fff;box-shadow:0 8px 18px -10px var(--brand)}
.btn-soft{background:var(--brand-soft);color:var(--brand)}
.btn-gold{background:var(--gold);color:var(--gold-ink)}
.btn-jade{background:var(--jade);color:#fff;box-shadow:0 8px 18px -10px var(--jade)}
.btn-line{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn-glass{background:rgba(255,255,255,.14);color:#fff}
.btn-block{width:100%}
.btn-sm{padding:10px 14px;font-size:13.5px;border-radius:12px}
.btn.cool{background:var(--line);color:var(--muted);box-shadow:none}
.spin{width:15px;height:15px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite;flex:none}

.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 16px;padding:2px 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:9px 14px;font:600 13.5px 'Manrope',sans-serif;cursor:pointer;display:flex;gap:6px;align-items:center;transition:background .2s,color .2s,transform .12s}
.chip:active{transform:scale(.95)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip em{font-style:normal;opacity:.6;font-size:12px}

.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--line);border-radius:14px;padding:4px;margin-bottom:18px}
.seg button{border:0;background:transparent;border-radius:11px;padding:10px;font:700 13.5px 'Manrope',sans-serif;color:var(--muted);cursor:pointer;transition:background .2s,color .2s}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.seg .count{background:var(--brand);color:#fff;border-radius:999px;font-size:11px;padding:1px 7px;margin-left:4px}

.empty{text-align:center;padding:36px 20px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:12px}
.empty b{color:var(--ink);font:700 16px 'Sora',sans-serif}
.pill{display:inline-block;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.mut{background:var(--line);color:var(--muted)}.pill.brand{background:var(--brand-soft);color:var(--brand)}.pill.jade{background:var(--jade-soft);color:var(--ok)}
.alert{background:var(--bad-soft);color:var(--bad);border-radius:14px;padding:12px 14px;font-weight:700;font-size:13.5px;margin-bottom:14px;line-height:1.4}

.promo-head{display:flex;align-items:center;gap:14px;margin:6px 0 14px}
.promo-head .logo{width:58px;height:58px;box-shadow:0 10px 20px -8px rgba(106,61,240,.55)}
.promo-head h1{font-size:26px;font-weight:800;line-height:1.1}
.rjcard{background:linear-gradient(135deg,#1F1958,#0F9F6E);color:#fff;border-radius:22px;padding:16px 18px;margin-bottom:16px;display:flex;align-items:center;gap:14px}
.rjcard .num{font-size:26px;font-weight:800;display:flex;align-items:center;gap:8px;margin-top:2px}
.rjcard small{opacity:.78;font-size:12.5px}
.rjcard .btn{margin-left:auto}
.stepper{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:20px}
.stepper div{font-size:12.5px;color:var(--muted);font-weight:600}
.stepper div::before{content:"";display:block;height:4px;border-radius:4px;background:var(--line);margin-bottom:6px;transition:background .3s}
.stepper div.done::before,.stepper div.now::before{background:var(--brand)}
.stepper div.now{color:var(--ink)}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
.cat{border:1.5px solid var(--line);background:var(--card);border-radius:18px;padding:14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:10px;transition:border-color .2s,background .2s,transform .12s}
.cat:active{transform:scale(.97)}
.cat.on{border-color:var(--brand);background:var(--brand-soft)}
.cat b{font:700 14px 'Sora',sans-serif;display:block}
.cat small{color:var(--muted);font-size:12.5px}
.field{margin-bottom:16px}
.field label{display:flex;justify-content:space-between;font-weight:700;font-size:13.5px;margin-bottom:8px}
.field label span{font-weight:600;color:var(--muted)}
.input{width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;outline:none;transition:border-color .2s,box-shadow .2s}
.input:focus{border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-soft)}
.input.bad{border-color:var(--bad)}
.hint{font-size:12.5px;margin-top:6px;color:var(--muted)}
.hint.bad{color:var(--bad);font-weight:600}.hint.ok{color:var(--ok)}
.card .adnote{font-size:12.5px;color:var(--muted);margin:0 0 12px}
.sheet ul.doc{list-style:none;display:flex;flex-direction:column;gap:6px;margin-top:4px}
.sheet ul.doc li{color:var(--muted);font-size:14px;padding-left:16px;position:relative}
.sheet ul.doc li::before{content:"";position:absolute;left:0;top:.6em;width:6px;height:6px;border-radius:50%;background:var(--brand)}
.sum{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:6px 16px;margin-bottom:16px}
.sum div{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px dashed var(--line)}
.sum div:last-child{border:0;font-weight:800}
.sum .neg{color:var(--bad)}
.nav-row{display:flex;gap:10px;margin-top:6px}.nav-row .btn:last-child{flex:1}

.pfp{display:flex;align-items:center;gap:14px;margin:6px 0 18px}
.avatar{width:64px;height:64px;border-radius:22px;background:var(--brand);color:#fff;display:grid;place-items:center;font:800 26px 'Sora',sans-serif;overflow:hidden;flex:none}
.avatar img{width:100%;height:100%;object-fit:cover}
.pfp h1{font-size:21px;font-weight:800;line-height:1.2}
.income{background:var(--hero);color:#fff;border-radius:24px;padding:18px 20px;margin-bottom:12px}
.income .num{font-size:30px;font-weight:800;display:flex;align-items:center;gap:8px;margin-top:4px}
.income small{opacity:.72;font-size:13px}
.income.jade{background:linear-gradient(135deg,#0B4F3A,#34C48A)}
.deposit{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.wallets{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.wallet{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}
.wallet small{color:var(--muted);font-size:12.5px;display:block}
.wallet .num{font-size:22px;font-weight:800;display:flex;align-items:center;gap:8px;margin-top:6px}
.menu{background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden;margin-top:12px}
.menu button{width:100%;display:flex;align-items:center;gap:14px;padding:16px;background:none;border:0;border-bottom:1px solid var(--line);cursor:pointer;text-align:left;font-weight:600;transition:background .15s}
.menu button:active{background:var(--brand-soft)}
.menu button:last-child{border:0}
.menu .ico:first-child{color:var(--brand)}
.menu .ico:last-child{margin-left:auto;color:var(--muted);width:18px;height:18px}
.ver{text-align:center;color:var(--muted);font-size:12.5px;margin-top:18px}

#nav{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;justify-content:center;pointer-events:none}
#nav .navbar{pointer-events:auto;width:100%;max-width:480px;display:grid;grid-template-columns:repeat(5,1fr);align-items:end;background:var(--card);background:var(--nav);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 6px calc(8px + env(safe-area-inset-bottom))}
.nb{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--muted);font:600 11px 'Manrope',sans-serif;cursor:pointer;transition:color .2s}
.nb .ico{transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.nb.on{color:var(--brand);font-weight:800}
.nb.on:not(.fab) .ico{transform:translateY(-2px) scale(1.12)}
.nb.fab .fabi{width:54px;height:54px;border-radius:19px;background:var(--brand);color:#fff;display:grid;place-items:center;margin-top:-26px;box-shadow:0 12px 22px -10px var(--brand);border:4px solid var(--bg);transition:transform .2s}
.nb.fab:active .fabi{transform:scale(.92)}
.nb.fab{color:var(--muted)}.nb.fab.on{color:var(--brand)}

#toasts{position:fixed;top:calc(12px + env(safe-area-inset-top));left:0;right:0;z-index:300;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 16px}
.toast{background:var(--ink);color:var(--bg);border-radius:18px;padding:12px 16px;display:flex;align-items:center;gap:12px;max-width:380px;box-shadow:0 14px 30px -12px rgba(0,0,0,.45);animation:tin .35s cubic-bezier(.2,.9,.3,1.2),tout .3s ease 3s forwards;font-weight:600;font-size:14px}
.toast b{display:block;font:800 17px 'Sora',sans-serif}
.toast small{display:block;opacity:.7;font-size:12.5px;font-weight:500}
.toast .coin{width:32px;height:32px;font-size:11px}
.toast.err{background:var(--bad);color:#fff}
.toast.jade{background:linear-gradient(135deg,#0B4F3A,#34C48A);color:#fff}

.sheet-wrap{position:fixed;inset:0;z-index:150;background:rgba(10,8,30,.55);display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .25s}
.sheet-wrap.open{opacity:1}
.sheet{width:100%;max-width:480px;max-height:88vh;overflow:auto;background:var(--bg);border-radius:28px 28px 0 0;padding:10px 18px calc(24px + env(safe-area-inset-bottom));transform:translateY(60px);transition:transform .35s cubic-bezier(.2,.9,.3,1)}
.sheet-wrap.open .sheet{transform:none}
.grab{width:44px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 14px}
.sheet h2{font-size:21px;font-weight:800;margin-bottom:6px}
.sheet .lead{color:var(--muted);margin-bottom:16px}
.sheet h4{font:700 14.5px 'Sora',sans-serif;margin:16px 0 4px}
.sheet p.doc{color:var(--muted);font-size:14px}
.opts{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px;margin-bottom:16px}
.opt{border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:12px 8px;font:700 14px 'Manrope',sans-serif;cursor:pointer;text-align:center;transition:border-color .2s,background .2s}
.opt.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand)}
.kv{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:4px 14px;margin-bottom:16px}
.kv div{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line);font-size:14px}
.kv div:last-child{border:0}
.linkbox{display:flex;gap:8px;align-items:center;background:var(--card);border:1.5px dashed var(--line);border-radius:14px;padding:10px 12px;margin:12px 0;font-size:13px;word-break:break-all}
.msgbox{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin:12px 0;font-size:13.5px;white-space:pre-line;color:var(--muted)}
.hist{font-size:13.5px;padding:10px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}
.gap{height:10px}
.stack{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.stack .field{margin:0}
.field.sub label{font-size:13px}
.badge{background:var(--brand);color:#fff;border-radius:999px;font-size:11px;padding:1px 8px;margin-left:8px}
.note{background:var(--brand-soft);color:var(--brand);border-radius:14px;padding:12px 14px;font-weight:600;font-size:13px;margin-bottom:14px;line-height:1.4}
.note.jade{background:var(--jade-soft);color:var(--ok)}
.pkgs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.pkg{border:1.5px solid var(--line);background:var(--card);border-radius:18px;padding:14px;text-align:left;cursor:pointer;transition:border-color .2s,background .2s,transform .12s}
.pkg:active{transform:scale(.97)}
.pkg.on{border-color:var(--brand);background:var(--brand-soft)}
.pkg b{display:block;font:800 22px 'Sora',sans-serif}
.pkg span{display:flex;align-items:center;gap:6px;margin-top:8px;font:700 13px 'Sora',sans-serif;color:var(--muted)}
.req{display:flex;align-items:center;gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}
.req b{display:block;word-break:break-word}
.req small{display:block;color:var(--muted);font-size:12.5px}
.swapbox{background:linear-gradient(135deg,var(--brand-soft),var(--jade-soft));border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:16px;text-align:center}
.swapbox .rate{font:800 22px 'Sora',sans-serif}
.swapbox .rate span{display:inline-flex;align-items:center;gap:6px;vertical-align:middle}
.swapbox small{color:var(--muted);display:block;margin-top:4px}

#fatal{position:fixed;inset:0;z-index:999;background:#0E0B22;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;text-align:center;gap:14px}
#fatal h2{font-family:'Sora',sans-serif;font-size:22px}
#fatal p{color:#9F9AC4;font-size:14px;max-width:340px;line-height:1.5}
#fatal button{background:#6A3DF0;color:#fff;border:0;border-radius:14px;padding:12px 22px;font-weight:700;cursor:pointer}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(300%)}}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes ring{0%{opacity:.55;transform:scale(.92)}100%{opacity:0;transform:scale(1.45)}}
@keyframes ping{0%{stroke-opacity:.12}30%{stroke-opacity:.6}100%{stroke-opacity:.12}}
@keyframes tin{from{transform:translateY(-24px) scale(.9);opacity:0}to{transform:none;opacity:1}}
@keyframes tout{to{transform:translateY(-16px);opacity:0}}
@keyframes pagein{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.shake{animation:shake .35s}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

(() => {

/* =====================================================================

function showFatal(title, msg) {

}

}

window.addEventListener('error', e => console.error('App error:', (e && e.error) || (e && e.message)));

let db, TS, P;
try {

/* =====================================================================

const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const fmt = n => Number(n || 0).toLocaleString('en-US');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const tg = window.Telegram && window.Telegram.WebApp;

const jrBal = u => (u && u.balance) || 0;

const netBal = u => ((u && u.balance) || 0) - ((u && u.debtTotal) || 0);

function setHTML(el, html) { if (!el) return false; if (el.__h === html) return false; el.innerHTML = html; el.__h = html; return true; }

function hap(kind) {
  if (store.get('pn_haptics') === 'off') return;
  try { if (kind === 'tap') tg.HapticFeedback.impactOccurred('light'); else tg.HapticFeedback.notificationOccurred(kind); } catch (e) {}
}
function openLink(url) {
  try {
    if (/^https?:\/\/(t|telegram)\.me\//i.test(url) && tg && tg.openTelegramLink) return tg.openTelegramLink(url);

  window.open(url, '_blank');
}
function copyText(t) {
  const done = () => { toast('Copied'); hap('success'); };
  const fallback = () => { const a = document.createElement('textarea'); a.value = t; document.body.appendChild(a); a.select(); try { document.execCommand('copy'); done(); } catch (e) {} a.remove(); };
  if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(t).then(done, fallback);
  fallback();
}

function toast(msg, opt = {}) {
  const key = (opt.coins ? 'c' + opt.coins : '') + (opt.rj ? 'r' + opt.rj : '') + '|' + msg + '|' + (opt.err ? 'e' : '');
  const root = $('#toasts'); if (!root) return;

  el.className = 'toast' + (opt.err ? ' err' : '') + (opt.rj ? ' jade' : '');

  else if (opt.coins) el.innerHTML = `${coin()}<div><b>+${fmt(opt.coins)} JR</b><small>${esc(msg || 'added to your balance')}</small></div>`;
  else el.innerHTML = `<div>${esc(msg)}</div>`;
  root.appendChild(el);
  while (root.children.length > 2) root.firstChild.remove();
  setTimeout(() => el.remove(), 3400);
}
const toastErr = m => { toast(m, { err: true }); hap('error'); };
function rewarded(amount, note) {
  toast(note, { coins: amount }); hap('success');
  const h = $('#hero'); if (h) { h.classList.remove('ping'); void h.offsetWidth; h.classList.add('ping'); }
}
function rewardedRJ(amount, note) {
  toast(note, { rj: amount }); hap('success');
}

function openSheet(html, mount) {
  const root = $('#sheetBody'); if (!root) return;
  root.innerHTML = html;
  const w = $('#sheetWrap'); w.hidden = false; requestAnimationFrame(() => w.classList.add('open'));
  if (mount) try { mount(root); } catch (e) { console.error('sheet mount', e); }
}
function closeSheet() {
  const w = $('#sheetWrap'); w.classList.remove('open'); setTimeout(() => { w.hidden = true; $('#sheetBody').innerHTML = ''; }, 250);
}
const sheetWrapEl = $('#sheetWrap'); if (sheetWrapEl) sheetWrapEl.addEventListener('click', e => { if (e.target.id === 'sheetWrap') closeSheet(); });

function applyTheme() {
  const pref = store.get('pn_theme') || 'auto';
  const sys = (tg && tg.colorScheme) || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const t = pref === 'auto' ? sys : pref;
  document.documentElement.dataset.theme = t;
  try { tg.setHeaderColor(t === 'dark' ? '#0E0B22' : '#F5F4FB'); tg.setBackgroundColor(t === 'dark' ? '#0E0B22' : '#F5F4FB'); } catch (e) {}
}

/* =====================================================================
   State
   ===================================================================== */
const S = {
  uid: null, user: {}, tasks: {}, tab: 'home', filter: 'all', promoTab: 'new', ui: {}, view: null, shown: null, screened: {}, chatCache: {}, botId: null, pending: {}, prevSub: null,
  wiz: { step: 1, type: 'join', url: '', title: '', steps: ['', '', ''], perUser: '', users: '' }
};

/* =====================================================================
   Income
   ===================================================================== */
function applyIncome(u, amt) {
  const d = new Date().toLocaleDateString('en-CA');
  if (!u.today || u.today.d !== d) u.today = { d, a: 0 };

        if (u.rjBalance <= 0) break;
        const pay = Math.min(u.rjBalance, d.left); if (pay <= 0) continue;
        u.rjBalance -= pay; d.left -= pay; u.debtTotal -= pay;
        u.outbox[`${id}_${ts}_${i++}`] = { owner: d.owner, amt: pay };
        if (d.left <= 0) delete u.debts[id];
      }
      if (u.debtTotal <= 0) { u.debtTotal = 0; u.debts = null; }
      return u;
    });
    if (tx.committed) await flushOutbox(S.uid);
  } catch (e) { console.warn('settleDebts', e); }
  S.settling = false;
}

async function resolveReview(owner, key, approve) {
  const ref = db.ref(`pn/pending/${owner}/${key}`);
  const tx = await ref.transaction(cur => { if (cur === null) return cur; if (cur.status !== 'pending') return; cur.status = 'resolving'; return cur; });
  const v = tx.committed ? tx.snapshot.val() : null;
  if (!v || v.status !== 'resolving') return false;
  if (approve) {
    await db.ref(P.user(v.uid)).transaction(u => {
      if (!u) return u;
      u.submitted = u.submitted || {}; u.done = u.done || {};
      u.done[v.taskId] = true; u.submitted[v.taskId] = 'approved'; applyTaskIncome(u, v.perUser); return u;
    });
  } else {
    await db.ref(P.user(v.uid)).transaction(u => { if (!u) return u; u.submitted = u.submitted || {}; u.submitted[v.taskId] = 'rejected'; return u; });
    await db.ref(P.task(v.taskId) + '/remaining').transaction(r => (r || 0) + 1);
    await db.ref(P.task(v.taskId) + '/status').set('live');
  }
  await ref.remove(); await db.ref('pn/pendingAll/' + key).remove();
  return true;
}

  if (!S.uid) return;
  try {
    const cutoff = Date.now() - CONFIG.reviewHours * 3600000;
    const snap = await db.ref('pn/pendingAll').orderByChild('createdAt').endAt(cutoff).limitToFirst(20).once('value');
    for (const [key, v] of Object.entries(snap.val() || {})) await resolveReview(v.owner, key, true);
  } catch (e) { console.warn('sweep', e); }
}

}

const feeOf = t => (CONFIG.fee && CONFIG.fee[t]) || 0;
const usersWord = n => `${fmt(n)} user${n === 1 ? '' : 's'}`;
function waitNote(type) {
  const t = { join: `Users who leave your channel or group within ${CONFIG.leave.days} days lose their reward, and it is returned to you. Make PMER's bot an admin so joins can be checked.`,
    reaction: `Reactions are checked by time. Users are paid after they open the post, react, and stay on it for ${CONFIG.reactionSeconds} seconds.`,
    view: `Users are paid after they open the post and stay on it for ${CONFIG.viewSeconds} seconds.`,
    website: `Users are paid after they open your website and stay on it for ${CONFIG.websiteSeconds} seconds. A service fee of ${fmt(feeOf('website'))} RJ per user is added when you publish.`,
    youtube: `Users are paid after they open your video and stay on it for ${CONFIG.youtubeSeconds} seconds.` }[type];
  return t ? `<div class="note">${t}</div>` : '';
}
function wizCost() { const w = S.wiz, per = parseInt(w.perUser, 10) || 0, users = parseInt(w.users, 10) || 0, fee = feeOf(w.type); return { per, users, fee, cost: (per + fee) * users }; }

function updateWiz() {
  const w = S.wiz, next = $('#wizNext');
  if (w.step === 1) {
    const r = checkUrl(w.type, w.url), h = $('#urlHint'), inp = $('#wUrl');
    if (!h) return;
    h.hidden = !!($('#blockBox') && !$('#blockBox').hidden);
    if (r.ok) { h.className = 'hint ok'; h.textContent = 'Link looks good.'; inp.classList.remove('bad'); }
    else if (r.msg) { h.className = 'hint bad'; h.textContent = r.msg; inp.classList.add('bad'); }
    else { h.className = 'hint'; h.textContent = CAT[w.type].hint; inp.classList.remove('bad'); }
    next.disabled = !r.ok;
  } else if (w.step === 2) {
    const n = w.title.trim().length, ok = n >= CONFIG.titleMin && n <= CONFIG.titleMax;
    const tc = $('#titleCount'); if (tc) tc.textContent = `${n}/${CONFIG.titleMax}`;
    const th = $('#titleHint'); if (th) { th.className = 'hint' + (ok ? ' ok' : ''); th.textContent = ok ? 'Title looks good.' : n < CONFIG.titleMin ? `Add ${CONFIG.titleMin - n} more character${CONFIG.titleMin - n === 1 ? '' : 's'}.` : `Titles can be at most ${CONFIG.titleMax} characters.`; }
    const stepsOk = w.type !== 'conditions' || w.steps.every(s => s.trim().length >= 5);
    next.disabled = !(ok && stepsOk);
  } else {
    const min = CONFIG.minReward[w.type], { per, users, fee, cost } = wizCost(), bal = rjBal(S.user);
    const perOk = per >= min, usersOk = users >= CONFIG.minUsers && users <= 1000000, ph = $('#perHint'), uh = $('#usersHint');
    if (ph) { ph.className = 'hint' + (w.perUser && !perOk ? ' bad' : ''); ph.textContent = w.perUser && !perOk ? `The minimum for ${CAT[w.type].label} is ${fmt(min)} RJ per user.` : ''; }
    if (uh) { uh.className = 'hint' + (w.users && !usersOk ? ' bad' : ''); uh.textContent = w.users && !usersOk ? `You need at least ${usersWord(CONFIG.minUsers)} for a campaign.` : ''; }
    const sc = $('#sCost'), sb = $('#sBal'); if (sc) sc.textContent = fmt(cost) + ' RJ'; if (sb) sb.textContent = fmt(bal) + ' RJ';
    const sfr = $('#sFeeRow'); if (sfr) sfr.hidden = !fee; const sf = $('#sFee'); if (sf) sf.textContent = fmt(fee * users) + ' RJ';
    const short = cost > bal, after = bal - cost;
    const sl = $('#sLbl'); if (sl) sl.textContent = short ? 'You still need' : 'RJ balance after publishing';
    const sa = $('#sAfter'); if (sa) { sa.textContent = fmt(Math.abs(after)) + ' RJ'; sa.className = short ? 'neg' : ''; }
    const fh = $('#fundHint'), showShort = short && per > 0 && users > 0;
    if (fh) { fh.hidden = !showShort; fh.textContent = `You have not enough RJ balance. You are ${fmt(cost - bal)} RJ short.`; }
    const ws = $('#wizSwap'); if (ws) ws.hidden = !showShort;
    const pb = $('#wizPublish'); if (pb) pb.disabled = !(perOk && usersOk);
  }
}

async function publish() {
  const w = S.wiz, r = checkUrl(w.type, w.url); if (!r.ok) return;
  const { per, users, fee, cost } = wizCost(), btn = $('#wizPublish');
  if (per < CONFIG.minReward[w.type] || users < CONFIG.minUsers) return;
  if (cost > rjBal(S.user)) { toastErr('You have not enough RJ balance'); btn.classList.remove('shake'); void btn.offsetWidth; btn.classList.add('shake'); return updateWiz(); }
  btn.disabled = true; btn.innerHTML = '<span class="spin"></span> Checking';
  const scr = await screenTarget(r.p, [w.title].concat(w.type === 'conditions' ? w.steps : []), w.type);
  if (!scr.ok) { showBlock(blockText(scr.reason)); btn.textContent = 'Publish campaign'; return updateWiz(); }
  btn.innerHTML = '<span class="spin"></span> Publishing';
  const tx = await db.ref(P.user(S.uid)).transaction(u => { if (!u || rjBal(u) < cost) return; u.rjBalance -= cost; u.spent = (u.spent || 0) + cost; return u; });
  if (!tx.committed) { toastErr('You have not enough RJ balance'); btn.textContent = 'Publish campaign'; return updateWiz(); }
  try {
    await db.ref(P.tasks).push().set({
      type: w.type, title: w.title.trim(), url: r.p.url, chat: r.p.chat || null, msgId: r.p.msgId || null, fee: fee || null,
      steps: w.type === 'conditions' ? w.steps.map(s => s.trim()) : null,
      perUser: per, total: users, remaining: users, owner: S.uid, ownerName: S.user.name || '', status: 'live', createdAt: TS
    });
  } catch (e) {
    console.error(e);
    await db.ref(P.user(S.uid)).transaction(u => { if (!u) return u; u.rjBalance = (u.rjBalance || 0) + cost; u.spent = Math.max(0, (u.spent || 0) - cost); return u; });
    toastErr('Could not publish. Your RJ balance was not charged.'); btn.textContent = 'Publish campaign'; return updateWiz();
  }
  S.wiz = { step: 1, type: 'join', url: '', title: '', steps: ['', '', ''], perUser: '', users: '' };
  S.promoTab = 'mine'; hap('success'); toast('Published. Your campaign is live.');
  renderPromote();
}

async function wizNext() {
  if (S.checking) return;
  S.checking = true;
  try { await wizNextInner(); } finally { S.checking = false; }
}
async function wizNextInner() {
  const w = S.wiz, btn = $('#wizNext');
  if (w.step === 1) {
    const r = checkUrl(w.type, w.url); if (!r.ok) return;
    btn.disabled = true; btn.innerHTML = '<span class="spin"></span> Checking link';
    const scr = await screenTarget(r.p, [], w.type);
    if (!scr.ok) {
      S.adminType = scr.reason === 'needadmin' ? (scr.chatType || 'channel') : null;
      showBlock(blockText(scr.reason), S.adminType ? adminButtons() : '');
      btn.textContent = 'Continue'; return updateWiz();
    }
    S.adminType = null;
  } else if (w.step === 2) {
    if (isBad(w.title) || (w.type === 'conditions' && w.steps.some(isBad))) return showBlock(HARAM_MSG);
  }
  w.step++; renderWizard(); window.scrollTo(0, 0);
}

          <div class="gap"></div><button class="btn btn-primary btn-block" id="depAdmin">${ico('send', 'sm')} Send to admin</button>
          <div class="gap"></div><button class="btn btn-line btn-block" id="depBack">Back</button>`;
      $$('.pkg', b).forEach(x => x.onclick = () => { pick = +x.dataset.i; draw(b); });
      const nx = $('#depNext', b); if (nx) nx.onclick = () => { page = 2; draw(b); };
      const bk = $('#depBack', b); if (bk) bk.onclick = () => { page = 1; draw(b); };
      const ad = $('#depAdmin', b); if (ad) ad.onclick = async () => {
        if (!logged) { logged = true; try { await db.ref('pn/deposits').push().set({ uid: S.uid, name: S.user.name || '', usd: pk.usd, jr: pk.jr, method: 'Binance', status: 'pending', createdAt: TS }); } catch (e) {} }
        openLink(CONFIG.supportLink);
      };
    };
    openSheet('', draw);
  },

  referral: () => {
    const u = S.user, list = Object.values(u.referrals || {}), link = `${CONFIG.botLink}?startapp=${S.uid}`, R = CONFIG.referral;
    const msg = SHARE_TEXT + '\n' + link;
    openSheet(`<h2>Invite friends</h2><p class="lead">You get ${fmt(R.bonusJR)} JR and ${fmt(R.bonusRJ)} RJ the moment a friend joins PMER with your link.</p>
      <div class="linkbox"><span class="grow">${esc(link)}</span><button class="btn btn-soft btn-sm" data-copy="${esc(link)}">${ico('copy', 'sm')} Copy</button></div>
      <div class="msgbox">${esc(msg)}</div>
      <button class="btn btn-primary btn-block" data-open="https://t.me/share/url?url=${encodeURIComponent(link)}&text=${encodeURIComponent(SHARE_TEXT)}">${ico('send', 'sm')} Share on Telegram</button>
      <div class="gap"></div>
      <button class="btn btn-soft btn-block" data-copy="${esc(msg)}">${ico('copy', 'sm')} Copy message</button>
      <h4>Your referrals (${list.length})</h4>${list.length ? list.map(r => `<div class="hist"><span>${esc(r.name || 'Friend')}</span><span class="${r.bonus ? '' : 'mut'}">${r.bonus ? '+' + fmt(R.bonusJR) + ' JR / ' + fmt(R.bonusRJ) + ' RJ' : 'Pending'}</span></div>`).join('') : '<p class="doc">No referrals yet.</p>'}
      <div class="kv" style="margin-top:14px"><div><span class="mut">Referral JR earned</span><b>${fmt(u.refEarned || 0)} JR</b></div><div><span class="mut">Referral RJ earned</span><b>${fmt(u.refEarnedRJ || 0)} RJ</b></div></div>`);
  },

  privacy: () => openSheet(`<h2>Privacy policy</h2>
    <h4>What we collect</h4><p class="doc">Your Telegram ID, name, username and profile photo as provided by Telegram, plus your JR and RJ balances, completed tasks, campaigns, swaps, withdrawals and deposit requests.</p>
    <h4>How we use it</h4><p class="doc">To run PMER, credit rewards, show your campaigns, process swaps and withdrawals, review payments, prevent fraud and answer support requests.</p>
    <h4>Ads</h4><p class="doc">Ads are delivered by third-party networks. Some ads open a partner web page in your browser. These networks may collect device and ad-interaction data under their own privacy policies.</p>
    <h4>Sharing</h4><p class="doc">We do not sell your personal data. Campaign owners only see totals for their campaigns, not who completed them.</p>
    <h4>Your choices</h4><p class="doc">You can ask support to delete your account data at any time. Some payment records may be kept as required for fraud prevention.</p>`),

  terms: () => openSheet(`<h2>Terms and conditions</h2>
    <h4>Using PMER</h4><p class="doc">You need a Telegram account. One person may use one account. Do not use bots, scripts, VPN farms or multiple accounts to collect rewards.</p>
    <h4>Rewards</h4><p class="doc">Ad tasks pay JR. Social tasks pay RJ. With conditions tasks are reviewed by the advertiser and approved automatically after ${CONFIG.reviewHours} hours if not reviewed. We may remove rewards and block accounts that show fake or abusive activity.</p>
    <h4>Swap</h4><p class="doc">You can swap JR to RJ at ${CONFIG.swap.jrIn} JR = ${CONFIG.swap.rjOut} RJ. Minimum swap is ${CONFIG.swap.min} JR. Swaps are final.</p>
    <h4>Withdrawals</h4><p class="doc">Withdrawals are only processed through Binance. Minimum withdrawal is ${CONFIG.withdraw.min} JR. The admin reviews each request before sending the funds.</p>
    <h4>Campaigns</h4><p class="doc">Campaigns must follow the law and Telegram rules. Every link is checked before it goes live. Adult and pornographic content is haram and strictly forbidden. Such links are rejected and the account may be blocked. The full campaign budget (in RJ) is reserved when you publish.</p>
    <h4>Leaving a channel</h4><p class="doc">If you join a channel or group through a Join task and leave within ${CONFIG.leave.days} days, the RJ reward is returned to the campaign owner. If your RJ balance is too low, it shows as a negative amount and your next RJ rewards go to the campaign owner until it is paid.</p>
    <h4>Changes</h4><p class="doc">We may update rewards, limits and these terms. Continuing to use PMER means you accept the changes.</p>`),

  settings: () => {
    const th = store.get('pn_theme') || 'auto', hp = store.get('pn_haptics') !== 'off';
    openSheet(`<h2>Settings</h2><h4>Appearance</h4><div class="opts">${['auto', 'light', 'dark'].map(k => `<button class="opt ${th === k ? 'on' : ''}" data-set="theme" data-v="${k}">${k[0].toUpperCase() + k.slice(1)}</button>`).join('')}</div>
      <h4>Vibration</h4><div class="opts"><button class="opt ${hp ? 'on' : ''}" data-set="haptics" data-v="on">On</button><button class="opt ${!hp ? 'on' : ''}" data-set="haptics" data-v="off">Off</button></div>`);
  },

  about: () => {
    const R = CONFIG.referral, L = CONFIG.adDailyLimit;
    openSheet(`<h2>About PMER</h2>
      <p class="lead">PMER is a reward and promotion app that runs inside Telegram. People earn JR and RJ by doing simple actions, and advertisers use RJ to send visitors to their channel, group, bot, website or video.</p>
      <h4>How you earn JR</h4>
      <ul class="doc">
        <li>Ad tasks: each ad task has 3 ads. Complete all 3 to get ${fmt(CONFIG.adReward)} JR. Each task can be completed ${L} times a day.</li>
        <li>Referrals: get ${fmt(R.bonusJR)} JR and ${fmt(R.bonusRJ)} RJ when a friend joins with your link.</li>
      </ul>
      <h4>How you earn RJ</h4>
      <ul class="doc">
        <li>Complete social tasks (Join, Reaction, View, With conditions, Website, YouTube).</li>
        <li>Swap JR to RJ at ${CONFIG.swap.jrIn} JR = ${CONFIG.swap.rjOut} RJ.</li>
      </ul>
      <h4>How you promote</h4><p class="doc">Open Promote, pick a campaign type, paste your link, add a title, then set the RJ reward per user and the number of users you need. The full budget is taken from your RJ balance when you publish.</p>
      <h4>Withdraw</h4><p class="doc">Withdraw JR through Binance. Minimum ${CONFIG.withdraw.min} JR.</p>
      <h4>Fair use</h4><p class="doc">One person, one account. Bots, scripts and fake activity are not allowed. Adult content, scams and illegal offers are not allowed in campaigns.</p>
      <div class="gap"></div>
      <button class="btn btn-primary btn-block" data-open="${esc(CONFIG.communityLink)}">${ico('send', 'sm')} Join our community</button>
      <div class="gap"></div>
      <button class="btn btn-soft btn-block" data-sheet="support">${ico('help', 'sm')} Contact support</button>`);
  }
};

/* =====================================================================
   Render + navigation
   ===================================================================== */
function render() {
  if (!S.uid) return;
  try {
    if (S.tab === 'home') renderHome();
    else if (S.tab === 'earn') renderEarn();
    else if (S.tab === 'tasks') renderTasks();
    else if (S.tab === 'promote') {
      if (S.promoTab === 'mine' || !$('#promoBody')) renderPromote();
      else { const c = $('.seg .count'); if (c) c.textContent = myTasks().length; if (S.wiz.step === 3) updateWiz(); }
    }
    else if (S.tab === 'profile') renderProfile();
  } catch (e) { console.error('render error:', e); }
}
function go(tab) {
  S.tab = tab;
  $$('.page').forEach(p => p.hidden = p.id !== 'p-' + tab);
  $$('.nb').forEach(b => b.classList.toggle('on', b.dataset.go === tab));
  const pg = $('#p-' + tab); if (!pg) return;
  pg.classList.remove('enter'); void pg.offsetWidth; pg.classList.add('enter');
  if (tab === 'promote') { $('#p-promote').__h = null; renderPromote(); } else render();
  window.scrollTo(0, 0); hap('tap');
}

const ACT = {
  'watch-group': b => watchGroupAd(b.dataset.gid, b.dataset.adbtn),
  filter: b => { S.filter = b.dataset.k; renderTasks(); },
  open: b => { const t = taskById(b.dataset.id); if (!t) return; S.ui[t.id] = Object.assign(S.ui[t.id] || {}, { opened: Date.now() }); openLink(t.url); },
  verify: b => doVerify(b.dataset.id),
  view: b => startView(b.dataset.id),
  'cond-open': b => condOpen(b.dataset.id),
  'cond-submit': b => condSubmit(b.dataset.id),
  pending: b => openPendingSheet(b.dataset.id),
  'promo-tab': b => { S.promoTab = b.dataset.k; renderPromote(); },
  'wiz-cat': b => { S.wiz.type = b.dataset.k; S.wiz.url = ''; S.wiz.perUser = ''; renderWizard(); },
  'wiz-next': () => wizNext(),
  'add-admin': () => openLink(adminLink(S.adminType)),
  recheck: () => wizNext(),
  'wiz-back': () => { S.wiz.step--; renderWizard(); window.scrollTo(0, 0); },
  'wiz-publish': () => publish()
};
document.addEventListener('click', e => {
  const t = e.target;
  let b;
  try {
    if ((b = t.closest('[data-act]'))) return ACT[b.dataset.act] && ACT[b.dataset.act](b);
    if ((b = t.closest('[data-go]'))) { if (!$('#sheetWrap').hidden) closeSheet(); return go(b.dataset.go); }
    if ((b = t.closest('[data-sheet]'))) { hap('tap'); if (!$('#sheetWrap').hidden) { closeSheet(); return setTimeout(() => SHEETS[b.dataset.sheet](), 260); } return SHEETS[b.dataset.sheet](); }
    if ((b = t.closest('[data-open]'))) return openLink(b.dataset.open);
    if ((b = t.closest('[data-copy]'))) return copyText(b.dataset.copy);
    if ((b = t.closest('[data-set]'))) {
      store.set(b.dataset.set === 'theme' ? 'pn_theme' : 'pn_haptics', b.dataset.v);
      $$(`[data-set="${b.dataset.set}"]`).forEach(x => x.classList.toggle('on', x === b)); applyTheme();
    }
  } catch (err) { console.error('click handler', err); }
});
document.addEventListener('input', e => {
  try {
    const un = e.target.closest && e.target.closest('[data-uname]');
    if (un) { const id = un.dataset.uname; S.ui[id] = Object.assign(S.ui[id] || {}, { uname: un.value }); return; }
    const el = e.target.closest('[data-wiz]'); if (!el) return;
    const w = S.wiz, k = el.dataset.wiz;
    if (k === 'step') w.steps[+el.dataset.i] = el.value;
    else if (k === 'perUser' || k === 'users') { el.value = el.value.replace(/\D/g, '').slice(0, 9); w[k] = el.value; }
    else w[k] = el.value;
    const bb = $('#blockBox'); if (bb) bb.hidden = true; S.adminType = null;
    updateWiz();
  } catch (err) { console.error('input handler', err); }
});

/* =====================================================================
   Boot (fully guarded)
   ===================================================================== */
async function ensureUser(tu) {
  const ref = db.ref(P.user(S.uid)), snap = await ref.once('value');
  const profile = { name: [tu.first_name, tu.last_name].filter(Boolean).join(' ') || tu.username || 'User', username: tu.username || '', photo: tu.photo_url || '' };
  if (snap.exists()) return ref.update(profile);
  const start = tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param;
  let referredBy = null;
  if (start && /^\d+$/.test(start) && start !== S.uid) {
    try { const r = await db.ref(P.user(start) + '/name').once('value'); if (r.exists()) referredBy = start; } catch (e) {}
  }
  await ref.set(Object.assign({ balance: 0, rjBalance: 0, totalIncome: 0, rjTotal: 0, tasksDone: 0, createdAt: TS, referredBy }, profile));
  if (referredBy) try { await db.ref(P.user(referredBy) + '/referrals/' + S.uid).set({ name: profile.name, bonus: 0 }); } catch (e) {}
}

function hideSplash() {
  const s = $('#splash'); if (!s || s.hidden) return;
  s.classList.add('leave');
  setTimeout(() => { s.hidden = true; }, 420);
}

async function boot() {
  const t0 = Date.now();

  // Fill logos
  try { $('#splashLogo').innerHTML = logoHTML(); $('#gateLogo').innerHTML = logoHTML(); } catch (e) {}

  // Guarantee splash always hides within 2.5s, no matter what
  const splashKill = setTimeout(hideSplash, 2500);

  // Telegram SDK
  try {
    if (tg) { tg.ready(); tg.expand(); tg.disableVerticalSwipes && tg.disableVerticalSwipes(); }
  } catch (e) { console.warn('tg init', e); }

  try { applyTheme(); } catch (e) {}

  const tu = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user)
          || (PREVIEW ? { id: 'preview', first_name: 'Preview', username: 'preview' } : null);

  if (!tu) {
    clearTimeout(splashKill);
    $('#splash').hidden = true;
    $('#gate').hidden = false;
    return;
  }

  S.uid = String(tu.id);

  // Show UI FIRST — user sees something immediately even if Firebase is slow
  $('#app').hidden = false;
  $('#nav').hidden = false;
  try { go('home'); } catch (e) { console.error('go home', e); }

  // Ensure user with a hard 8 second timeout
  try {
    await Promise.race([
      ensureUser(tu),
      new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 8000))
    ]);
  } catch (e) {
    console.warn('ensureUser failed:', e);
    toastErr('Could not reach the server. Data may be delayed.');
  }

  // Setup realtime listeners (each guarded)
  let firstUser = true;
  try {
    db.ref(P.user(S.uid)).on('value', s => {
      try {
        const u = s.val() || {};
        notifySubmissions(u); notifyCredits(u);
        S.user = u; render();
        if (firstUser) { firstUser = false; checkReferral(u); }
        if ((u.debtTotal || 0) > 0 && (u.rjBalance || 0) > 0) settleDebts();
      } catch (err) { console.error('user listener', err); }
    }, err => console.error('user listener error', err));
  } catch (e) { console.error('user listener setup', e); }

  try {
    db.ref('pn/pending/' + S.uid).on('value', s => {
      S.pending = s.val() || {};
      if (S.tab === 'promote' && S.promoTab === 'mine') renderMine();
    }, err => console.warn('pending listener', err));
  } catch (e) { console.warn('pending setup', e); }

  try {
    db.ref(P.tasks).limitToLast(300).on('value', s => {
      S.tasks = s.val() || {};
      render();
    }, err => console.warn('tasks listener', err));
  } catch (e) { console.warn('tasks setup', e); }

  // Background sweeps — non-blocking
  sweepPending().catch(() => {});
  flushOutbox(S.uid).catch(() => {});
  setInterval(() => sweepPending().catch(() => {}), 60000);
  sweepJoins().catch(() => {});
  setInterval(() => sweepJoins().catch(() => {}), 300000);

  // Hide splash as soon as reasonable
  const wait = Math.max(0, 900 - (Date.now() - t0));
  setTimeout(() => { clearTimeout(splashKill); hideSplash(); }, wait);

  // Log firebase connection
  try {
    db.ref('.info/connected').on('value', s => console.log('Firebase connected:', s.val() === true));
  } catch (e) {}
}

boot().catch(e => {
  console.error('boot failed:', e);
  showFatal('PMER could not start', (e && e.message) || 'Unknown error. Please try again.');
});

})();
</script>
